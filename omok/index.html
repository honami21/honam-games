<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="꼬비샘과 쉬는 시간"/>
<meta name="theme-color" content="#2a2860"/>
<title>꼬비의 오목 대결 - 꼬비샘과 쉬는 시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6ec; --cream2:#f1e2d2; --edge:#ecc9b0; --ink:#2c2950; --ink2:#6f6585;
    --coral:#ee5a6f; --coral-d:#c8455a; --sun:#ffd25e; --sun-d:#d9a92c; --mint:#7ccf74; --mint-d:#3f8f4a; --sky:#8fc7ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a2860 url(img/bg.jpg) center / cover no-repeat;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink); }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .hidden { display:none !important; }
  button { font-family:'Jua',sans-serif; }

  /* ===== 상단 바 ===== */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:space-between;pointer-events:none}
  .topbar .right{display:flex;gap:8px}
  .topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:20px;padding:7px 14px;
    font-family:'Jua',sans-serif;font-size:16px;color:var(--ink);background:rgba(255,248,238,.94);box-shadow:0 3px 0 var(--edge);text-decoration:none;cursor:pointer;line-height:1.2}
  .topbar a:hover,.topbar button:hover{filter:brightness(1.04)}
  .topbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #sndToggle{padding:7px 10px}
  #sndToggle.muted{opacity:.7}
  .kbgm-btn{padding:7px 10px}

  /* ===== 덮개 화면 (시작 / 대기) ===== */
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:58px 16px 16px; z-index:20; overflow-y:auto; background:rgba(30,20,70,.3); }
  .section { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px; margin:auto; }
  .card { background:var(--cream); border:3px solid var(--ink); border-radius:28px; box-shadow:0 8px 0 var(--ink), 0 16px 30px rgba(20,10,50,.35);
    padding:20px 24px 24px; width:100%; position:relative; }
  .logo { height:auto; width:min(420px, 92%); display:block; margin:-4px auto 0; }
  .lead { font-size:clamp(16px,2.6vw,19px); line-height:1.5; color:var(--ink); margin:8px 0 12px; word-break:keep-all; }
  .lead b { color:var(--coral-d); font-weight:normal; }
  .start-wrap { position:relative; width:100%; }
  .start-ggobi { position:absolute; width:150px; right:-120px; bottom:-10px; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(20,10,50,.25)); }
  @media (max-width:860px){ .start-ggobi{ display:none; } }

  .box { background:#fff; border:2px solid var(--cream2); border-radius:18px; padding:12px 14px 14px; margin-top:12px; text-align:left; }
  .box-title { color:var(--coral-d); font-size:18px; margin-bottom:8px; text-align:center; }
  .field { display:flex; gap:8px; align-items:center; }
  .field input { flex:1; min-width:0; padding:10px 14px; border-radius:16px; border:2.5px solid var(--cream2); background:#fff; color:var(--ink);
    font-size:18px; font-family:'Jua',sans-serif; -webkit-user-select:text; user-select:text; outline:none; }
  .field input:focus { border-color:var(--coral); }
  .field input::placeholder { color:#c9b5a3; }
  #codeInput { letter-spacing:8px; text-align:center; font-size:24px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:7px 4px; cursor:pointer; font-size:17px; line-height:1.35; word-break:keep-all; }
  .opt input { appearance:none; -webkit-appearance:none; flex:none; width:26px; height:26px; border:3px solid var(--ink); border-radius:8px; background:#fff; margin-top:-1px; cursor:pointer; position:relative; }
  .opt input:checked { background:var(--sun); }
  .opt input:checked::after { content:''; position:absolute; left:6px; top:1px; width:7px; height:13px; border:solid var(--ink); border-width:0 3.5px 3.5px 0; transform:rotate(45deg); }
  .opt small { display:block; font-size:14px; color:var(--ink2); margin-top:2px; }
  .msg { min-height:20px; font-size:15px; color:var(--coral-d); margin-top:8px; text-align:center; word-break:keep-all; }

  .game-btn { padding:11px 24px; font-size:clamp(17px,2.8vw,20px); border-radius:40px; border:3px solid var(--ink); color:#fff;
    cursor:pointer; min-width:120px; box-shadow:none; transition:transform .08s, box-shadow .08s; white-space:nowrap; }
  .game-btn:active { transform:translateY(2px) scale(.97); }
  .game-btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-primary { background:var(--coral); }
  .btn-info { background:var(--sun); color:var(--ink); }
  .btn-secondary { background:#fff; color:var(--ink); }
  .btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  /* 대기 화면 */
  .wait-img { width:150px; display:block; margin:-80px auto 0; filter:drop-shadow(0 4px 0 rgba(44,41,80,.2)); }
  .code-label { font-size:18px; color:var(--ink2); margin-top:6px; }
  .code-big { display:flex; gap:10px; justify-content:center; margin:8px 0 6px; }
  .code-big span { width:clamp(56px,14vw,76px); height:clamp(70px,17vw,92px); display:flex; align-items:center; justify-content:center; font-size:clamp(44px,11vw,62px);
    background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:0 5px 0 var(--ink); color:var(--coral-d); }
  .tags { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:10px 0 0; }
  .tag { font-size:14px; padding:3px 10px; border-radius:20px; background:#fff1c9; border:2px solid var(--sun-d); color:var(--ink); }
  .dots::after { content:''; animation:dots 1.5s steps(4) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* ===== 대국 화면 ===== */
  #game { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:56px 10px 12px; gap:10px; }
  #players { display:flex; align-items:stretch; gap:8px; width:100%; max-width:640px; }
  .pcard { flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:var(--cream); border:3px solid var(--ink); border-radius:18px;
    box-shadow:0 4px 0 var(--ink); padding:6px 12px; transition:background .2s, transform .2s; position:relative; }
  .pcard img.st { width:34px; height:34px; flex:none; }
  .pcard .nm { font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .pcard .sub { font-size:13px; color:var(--ink2); text-align:left; white-space:nowrap; }
  .pcard .me { font-size:12px; background:var(--coral); color:#fff; border-radius:10px; padding:1px 7px; margin-left:4px; vertical-align:2px; }
  .pcard.turn { background:#fff1c9; transform:translateY(-2px); box-shadow:0 6px 0 var(--ink), 0 0 0 4px var(--sun); }
  .pcard .tm { margin-left:auto; flex:none; font-size:22px; color:var(--coral-d); min-width:34px; text-align:right; }
  .pcard .tm.low { animation:blink .5s steps(2) infinite; }
  @keyframes blink { 50%{ opacity:.25 } }
  .pcard .off { position:absolute; right:8px; bottom:-9px; font-size:12px; background:var(--ink2); color:#fff; border-radius:10px; padding:1px 7px; }
  .vs { align-self:center; color:var(--sun); font-size:22px; text-shadow:0 2px 0 var(--ink); flex:none; }
  #status { min-height:30px; font-size:clamp(17px,3vw,21px); color:#fff; text-shadow:0 2px 0 rgba(20,10,50,.8); text-align:center; word-break:keep-all; padding:0 6px; }
  #status b { color:var(--sun); font-weight:normal; }
  #boardWrap { position:relative; border:4px solid var(--ink); border-radius:14px; box-shadow:0 7px 0 var(--ink), 0 16px 30px rgba(20,10,50,.4); overflow:hidden; flex:none; background:#e5b465; }
  #board { display:block; touch-action:none; cursor:pointer; }
  #actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; min-height:52px; align-items:center; }
  #actions .game-btn { padding:8px 18px; font-size:17px; min-width:0; }
  #placeBtn { background:var(--coral); font-size:19px !important; padding:9px 26px !important; }
  .side-ggobi { position:fixed; left:max(12px, calc(50% - 560px)); bottom:10px; width:170px; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(20,10,50,.25)); transition:opacity .3s; }
  .side-room { position:fixed; right:max(12px, calc(50% - 560px)); bottom:18px; background:var(--cream); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); padding:6px 14px; font-size:15px; color:var(--ink2); text-align:center; }
  .side-room b { display:block; font-size:24px; color:var(--coral-d); font-weight:normal; letter-spacing:3px; }
  @media (max-width:1000px), (max-height:560px){ .side-ggobi, .side-room { display:none; } }

  /* 응원 스티커 */
  #stkBtn { background:var(--sky); color:var(--ink); }
  #stkTray { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); z-index:46; background:var(--cream); border:3px solid var(--ink); border-radius:22px;
    box-shadow:0 6px 0 var(--ink), 0 14px 26px rgba(20,10,50,.35); padding:10px 12px 12px; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; width:min(420px, calc(100vw - 20px)); }
  #stkTray .tt { grid-column:1 / -1; font-size:15px; color:var(--ink2); text-align:center; }
  #stkTray button { border:none; background:none; padding:2px; cursor:pointer; border-radius:14px; transition:transform .1s; }
  #stkTray button:hover { background:#fff1c9; } #stkTray button:active { transform:scale(.9); }
  #stkTray img { width:100%; display:block; }
  #stkTray.cool button { opacity:.4; pointer-events:none; }
  #stkShow { position:fixed; z-index:45; pointer-events:none; display:flex; flex-direction:column; align-items:center; }
  #stkShow img { width:100%; display:block; filter:drop-shadow(0 6px 0 rgba(20,10,50,.3)); }
  #stkShow span { margin-top:-8px; background:var(--cream); border:3px solid var(--ink); border-radius:16px; box-shadow:0 3px 0 var(--ink); padding:2px 12px; font-size:17px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  #stkShow.on { animation:stkPop 2.6s ease-out forwards; }
  @keyframes stkPop { 0%{ opacity:0; transform:scale(.3) rotate(-12deg) } 12%{ opacity:1; transform:scale(1.08) rotate(3deg) } 20%{ transform:scale(1) rotate(0) } 82%{ opacity:1; transform:scale(1) } 100%{ opacity:0; transform:scale(.9) translateY(-20px) } }

  /* 알림 (차례 넘어감 등) */
  #toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); z-index:30; background:var(--cream); border:3px solid var(--ink); border-radius:20px;
    box-shadow:0 5px 0 var(--ink); padding:10px 20px; font-size:20px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .25s; }
  #toast.show { opacity:1; }

  /* ===== 결과 / 확인 창 ===== */
  .modal { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(30,20,70,.45); }
  .modal .card { max-width:400px; text-align:center; margin-top:60px; }
  .modal .res-img { width:140px; display:block; margin:-90px auto 0; filter:drop-shadow(0 4px 0 rgba(44,41,80,.2)); }
  .modal h2 { font-size:clamp(30px,6vw,38px); font-weight:normal; color:var(--coral-d); margin-top:4px; }
  .modal p { font-size:17px; line-height:1.5; color:var(--ink); margin-top:6px; word-break:keep-all; }

  /* 휴대폰 */
  @media (max-width:760px), (pointer:coarse){
    .topbar{top:6px;left:6px;right:6px}
    .topbar a,.topbar button{font-size:13px;padding:6px 10px;gap:4px}
    .topbar .t{display:none}
    .card { padding:16px 14px 18px; border-radius:24px; }
    #game { padding:44px 6px 8px; gap:7px; }
    .pcard { padding:4px 8px; gap:6px; border-radius:14px; border-width:2.5px; }
    .pcard img.st { width:26px; height:26px; }
    .pcard .nm { font-size:16px; } .pcard .sub { font-size:11px; } .pcard .tm { font-size:18px; }
    .vs { font-size:17px; }
    #boardWrap { border-width:3px; border-radius:10px; }
  }
  /* 버튼 아래 두꺼운 그림자를 없애 테두리 두께를 위아래 같게 */
  .game-btn, .diff-btn, .btn, .btn-s, .btn-r, .btn-p, .tbtn, .pad button, .topbar a, .topbar button { box-shadow:none !important; }
  .game-btn:active, .diff-btn:active, .btn:active, .pad button:active { transform:translateY(2px) scale(.97) !important; }
  .tbtn.on { transform:scale(.94) !important; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../" id="home-link" title="꼬비샘과 쉬는 시간으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="t">쉬는 시간</span></a>
  <div class="right">
    <button id="sndToggle" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
    <button id="fs-btn" type="button" title="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="t" id="fs-txt">전체화면</span></button>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById('fs-btn'),t=document.getElementById('fs-txt'),d=document,el=d.documentElement;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  var framed=false;try{framed=window.top!==window;}catch(e){framed=true;}
  if(!can){
    if(framed){t.textContent='새 창으로';b.title='새 창으로 크게 열기';b.addEventListener('click',function(){window.open(location.href,'_blank');});}
    else b.style.display='none';
    return;
  }
  var cur=function(){return d.fullscreenElement||d.webkitFullscreenElement;};
  b.addEventListener('click',function(){
    if(cur()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{var pr=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(pr&&pr.catch)pr.catch(function(){});}
    b.blur();
  });
  var upd=function(){t.textContent=cur()?'나가기':'전체화면';};
  d.addEventListener('fullscreenchange',upd);d.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<!-- 대국 화면 -->
<div id="game" class="hidden">
  <div id="players">
    <div class="pcard" id="pB"><img class="st" src="img/stone-black.png" alt="흑"><div style="min-width:0"><div class="nm" id="nmB">-</div><div class="sub">흑 · 먼저 둬요</div></div><div class="tm" id="tmB"></div></div>
    <div class="vs">VS</div>
    <div class="pcard" id="pW"><img class="st" src="img/stone-white.png" alt="백"><div style="min-width:0"><div class="nm" id="nmW">-</div><div class="sub">백</div></div><div class="tm" id="tmW"></div></div>
  </div>
  <div id="status"></div>
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="actions"></div>
</div>
<img class="side-ggobi hidden" id="sideGgobi" src="img/ggobi-think.png" alt="">
<div class="side-room hidden" id="sideRoom">방 코드<b id="sideCode"></b><span id="sideRule"></span></div>

<!-- 시작 화면 -->
<div id="startScreen" class="screen">
  <div class="section">
    <div class="start-wrap">
      <div class="card">
        <img class="logo" src="img/logo.png" alt="꼬비의 오목 대결" width="900" height="291">
        <p class="lead">친구와 <b>방 코드</b>로 만나 번갈아 돌을 둬요.<br>가로, 세로, 대각선으로 <b>다섯 개</b>를 먼저 이으면 이겨요!</p>
        <div class="box">
          <div class="field"><input id="nameInput" maxlength="8" placeholder="내 이름 (별명도 좋아요)" autocomplete="off"></div>
        </div>
        <div class="box">
          <div class="box-title">규칙 고르기</div>
          <label class="opt"><input type="checkbox" id="optTimer" checked><span>한 수에 1분 제한<small>1분 안에 두지 않으면 차례가 친구에게 넘어가요.</small></span></label>
          <label class="opt"><input type="checkbox" id="optRenju"><span>공식 규칙 (렌주 규칙)<small>먼저 두는 흑은 3·3, 4·4, 여섯 개 이상(장목) 자리에 둘 수 없어요. 어른들의 정식 오목이에요.</small></span></label>
          <div class="btn-row"><button class="game-btn btn-primary" id="createBtn">방 만들기</button><button class="game-btn btn-info" id="localBtn">한 화면에서 둘이 하기</button></div>
          <p style="font-size:14px;color:var(--ink2);margin-top:8px;text-align:center;word-break:keep-all">한 화면에서 둘이 하기는 컴퓨터나 휴대폰 하나로 번갈아 둬요. 방 코드가 필요 없어요.</p>
        </div>
        <div class="box">
          <div class="box-title">방 코드로 들어가기</div>
          <div class="field">
            <input id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off">
            <button class="game-btn btn-info" id="joinBtn" style="min-width:0">들어가기</button>
          </div>
          <p style="font-size:14px;color:var(--ink2);margin-top:8px;text-align:center;word-break:keep-all">먼저 들어온 한 명이 대결하고, 그다음부터는 구경할 수 있어요.</p>
        </div>
        <div class="msg" id="startMsg"></div>
      </div>
      <img class="start-ggobi" src="img/ggobi-think.png" alt="">
    </div>
  </div>
</div>

<!-- 친구 기다리기 -->
<div id="waitScreen" class="screen hidden">
  <div class="section">
    <div class="card" style="margin-top:80px">
      <img class="wait-img" src="img/ggobi-wait.png" alt="">
      <div class="code-label">우리 방 코드</div>
      <div class="code-big" id="codeBig"></div>
      <p class="lead">친구에게 이 번호를 알려 주세요.<br><span class="dots">친구를 기다리는 중</span></p>
      <div class="tags" id="waitTags"></div>
      <div class="btn-row"><button class="game-btn btn-secondary" id="cancelWaitBtn">방 없애기</button></div>
    </div>
  </div>
</div>

<!-- 결과 -->
<div id="resultModal" class="modal hidden">
  <div class="card">
    <img class="res-img" id="resImg" src="img/ggobi-cheer.png" alt="">
    <h2 id="resTitle"></h2>
    <p id="resText"></p>
    <div class="btn-row" id="resBtns"></div>
  </div>
</div>

<!-- 한 화면에서 둘이 하기 -->
<div id="localModal" class="modal hidden">
  <div class="card">
    <h2 style="font-size:26px;margin-top:0">한 화면에서 둘이 하기</h2>
    <p>두 사람 이름을 적어 주세요.</p>
    <div class="box" style="margin-top:10px">
      <div class="field" style="margin-bottom:8px"><img src="img/stone-black.png" alt="흑" style="width:30px"><input id="lnB" maxlength="8" placeholder="흑 (먼저 두는 사람)" autocomplete="off"></div>
      <div class="field"><img src="img/stone-white.png" alt="백" style="width:30px"><input id="lnW" maxlength="8" placeholder="백" autocomplete="off"></div>
    </div>
    <div class="tags" id="localTags"></div>
    <div class="btn-row"><button class="game-btn btn-secondary" id="lnCancel">취소</button><button class="game-btn btn-primary" id="lnStart">시작!</button></div>
  </div>
</div>

<!-- 선 정하기 -->
<div id="chooseModal" class="modal hidden">
  <div class="card">
    <img class="res-img" src="img/ggobi-think.png" alt="">
    <h2 style="font-size:28px">누가 먼저 둘까요?</h2>
    <p id="chText"></p>
    <div class="btn-row" style="flex-direction:column;align-items:center">
      <button class="game-btn btn-primary" id="chHost" style="min-width:220px"></button>
      <button class="game-btn btn-primary" id="chGuest" style="min-width:220px"></button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getFirestore, doc, onSnapshot, runTransaction, updateDoc, serverTimestamp, increment,
  collection, query, where, limit, getDocs, deleteDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDw2EvTh7PVBrPnkii2F1kPGcqbzcIo41s",
  authDomain: "honamsaem-class-games.firebaseapp.com",
  projectId: "honamsaem-class-games",
  storageBucket: "honamsaem-class-games.firebasestorage.app",

  appId: "1:251087835017:web:ef601265c56affe8ca1b58"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const ROOMS = 'omok-rooms';
const N = 15, EMPTY_BOARD = '.'.repeat(N * N);
const TURN_SEC = 60;
const STALE_MS = 3 * 60 * 60 * 1000;   // 3시간 지난 방은 정리
const $ = id => document.getElementById(id);

// ---------- 내 정보 ----------
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function sstore(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
let myId = store('omok-id');
if (!myId) { myId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); store('omok-id', myId); }
$('nameInput').value = store('omok-name') || '';

// ---------- 소리 ----------
let soundOn = store('omok-sound') !== 'off';
let actx = null;
function updSnd() { $('sndToggle').textContent = soundOn ? '🔊' : '🔈'; $('sndToggle').classList.toggle('muted', !soundOn); }
updSnd();
$('sndToggle').onclick = () => { soundOn = !soundOn; store('omok-sound', soundOn ? 'on' : 'off'); updSnd(); };
function beep(kind) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const tone = (f, s, d, type = 'sine', v = .25) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + s);
      g.gain.setValueAtTime(v, t + s); g.gain.exponentialRampToValueAtTime(.001, t + s + d);
      o.connect(g); g.connect(actx.destination); o.start(t + s); o.stop(t + s + d + .02);
    };
    if (kind === 'stone') { tone(900, 0, .07, 'triangle', .35); tone(420, 0, .12, 'sine', .25); }
    else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .22)); }
    else if (kind === 'lose') { [392, 330, 262].forEach((f, i) => tone(f, i * .16, .35, 'sine', .2)); }
    else if (kind === 'join') { tone(660, 0, .15, 'triangle'); tone(880, .12, .2, 'triangle'); }
    else if (kind === 'tick') { tone(1200, 0, .05, 'square', .06); }
    else if (kind === 'bad') { tone(180, 0, .18, 'sawtooth', .12); }
  } catch (e) {}
}

// ---------- 그림 ----------
const imgB = new Image(); imgB.src = 'img/stone-black.png';
const imgW = new Image(); imgW.src = 'img/stone-white.png';
imgB.onload = imgW.onload = () => draw();

// ============================================================
//  오목 규칙
// ============================================================
const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
function at(bd, x, y) { return (x < 0 || y < 0 || x >= N || y >= N) ? '#' : bd[y * N + x]; }
function put(bd, x, y, c) { bd[y * N + x] = c; }
function runAt(bd, x, y, dx, dy, c) {
  let s = 0, e = 0;
  while (at(bd, x - (s + 1) * dx, y - (s + 1) * dy) === c) s++;
  while (at(bd, x + (e + 1) * dx, y + (e + 1) * dy) === c) e++;
  return { s, e, len: s + e + 1 };
}
// 돌을 놓은 뒤 이겼는지: 이긴 줄의 칸 목록, 아니면 null
function winLine(bd, x, y, c, renju) {
  for (const [dx, dy] of DIRS) {
    const r = runAt(bd, x, y, dx, dy, c);
    if (renju && c === 'b' ? r.len === 5 : r.len >= 5) {
      const cells = [];
      for (let k = -r.s; k <= r.e; k++) cells.push((y + k * dy) * N + (x + k * dx));
      return cells;
    }
  }
  return null;
}
// --- 렌주 금수 (흑만) ---
// (x,y)에 흑돌이 있다고 보고, 이 방향에서 돌 하나를 더 두면 '정확히 다섯'이 되는 자리들
function fivePoints(bd, x, y, dx, dy) {
  const pts = [];
  for (let k = -4; k <= 4; k++) {
    if (!k) continue;
    const px = x + k * dx, py = y + k * dy;
    if (at(bd, px, py) !== '.') continue;
    put(bd, px, py, 'b');
    const r = runAt(bd, px, py, dx, dy, 'b');
    if (r.len === 5 && k - r.s <= 0 && 0 <= k + r.e) pts.push(k);
    put(bd, px, py, '.');
  }
  return pts;
}
function foursIn(bd, x, y, dx, dy) {
  const p = fivePoints(bd, x, y, dx, dy);
  if (p.length === 2 && p[1] - p[0] === 5) return 1;   // 열린 4 (.XXXX.)는 하나로 셈
  return p.length;
}
function isStraightFour(bd, x, y, dx, dy) {
  const p = fivePoints(bd, x, y, dx, dy);
  for (const a of p) for (const b of p) if (b - a === 5) return true;
  return false;
}
function threeIn(bd, x, y, dx, dy, depth) {
  for (let k = -4; k <= 4; k++) {
    if (!k) continue;
    const px = x + k * dx, py = y + k * dy;
    if (at(bd, px, py) !== '.') continue;
    put(bd, px, py, 'b');
    const sf = isStraightFour(bd, x, y, dx, dy);
    put(bd, px, py, '.');
    if (sf && (depth >= 2 || !isForbidden(bd, px, py, depth + 1))) return true;
  }
  return false;
}
function isForbidden(bd, x, y, depth = 0) {
  if (at(bd, x, y) !== '.') return false;
  put(bd, x, y, 'b');
  let res = false, five = false, over = false;
  for (const [dx, dy] of DIRS) { const r = runAt(bd, x, y, dx, dy, 'b'); if (r.len === 5) five = true; if (r.len >= 6) over = true; }
  if (!five) {
    if (over) res = 'long';
    else {
      let f = 0; for (const [dx, dy] of DIRS) f += foursIn(bd, x, y, dx, dy);
      if (f >= 2) res = '44';
      else {
        let t = 0; for (const [dx, dy] of DIRS) if (threeIn(bd, x, y, dx, dy, depth)) t++;
        if (t >= 2) res = '33';
      }
    }
  }
  put(bd, x, y, '.');
  return res;
}
const FORBID_NAME = { '33': '3·3', '44': '4·4', 'long': '장목(여섯 개 이상)' };
function allForbidden(bdStr) {
  const bd = bdStr.split(''), out = new Map();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (bd[y * N + x] !== '.') continue;
    let near = false;
    for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) if (at(bd, x + dx, y + dy) === 'b') { near = true; break; }
    if (!near) continue;
    const f = isForbidden(bd, x, y);
    if (f) out.set(y * N + x, f);
  }
  return out;
}

// ============================================================
//  상태
// ============================================================
let code = null, ref = null, unsub = null, room = null, role = null; // role: 'host' | 'guest' | 'watch'
let tickKey = '', tickStart = 0, passSent = '', lastSeenKey = '', otherHb = null, otherSeenAt = 0;
let selected = -1, hover = -1, forbidMap = new Map(), forbidKey = '', busy = false;
let hbTimer = null, shownResultFor = '', lastMoveSeen = '';

const other = c => c === 'b' ? 'w' : 'b';
const keyOf = d => `${d.round || 0}-${d.tick || 0}`;
function myColor() {
  if (!room || role === 'watch') return null;
  if (role === 'local') return room.turn;
  const hc = room.hostColor || 'b';
  return role === 'host' ? hc : other(hc);
}
function nameOf(c) {
  if (!room) return '';
  const hc = room.hostColor || 'b';
  return (c === hc ? room.hostName : room.guestName) || '?';
}
// 배경 음악: 게임 중에는 원래 크기, 대기실과 결과 화면에서는 작게
KBGM.init({ key:'omok', tracks:{ play:'audio/bgm-play.mp3' } });
KBGM.button({ after: $('sndToggle') });
let bgmJingled = false;
function show(id) {
  ['startScreen', 'waitScreen', 'game'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  if (id !== 'game') KBGM.calm();
  const g = id === 'game';
  $('sideGgobi').classList.toggle('hidden', !g); $('sideRoom').classList.toggle('hidden', !g);
  if (g) layout();
}
let toastT = 0;
function toast(t, ms = 1800) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms); }
function errText(e) {
  const c = (e && (e.code || e.message)) || '';
  if (String(c).includes('permission')) return '방 기능 설정이 아직 안 되어 있어요. 선생님께 알려 주세요.';
  if (String(c).includes('unavailable') || !navigator.onLine) return '인터넷 연결을 확인해 주세요.';
  return '잠시 후 다시 해 주세요.';
}
function getName() {
  const n = $('nameInput').value.trim().replace(/\s+/g, ' ').slice(0, 8);
  if (!n) { $('startMsg').textContent = '먼저 내 이름을 적어 주세요.'; $('nameInput').focus(); return null; }
  store('omok-name', n); return n;
}

// ============================================================
//  방 만들기 / 들어가기
// ============================================================
async function cleanupOld() {
  try {
    const q = query(collection(db, ROOMS), where('updatedAt', '<', Timestamp.fromMillis(Date.now() - STALE_MS)), limit(20));
    const snap = await getDocs(q);
    snap.forEach(d => deleteDoc(d.ref).catch(() => {}));
  } catch (e) {}
}

$('createBtn').onclick = async () => {
  const name = getName(); if (!name || busy) return;
  busy = true; $('startMsg').textContent = '';
  $('createBtn').disabled = true;
  const renju = $('optRenju').checked, timer = $('optTimer').checked;
  try {
    let made = null;
    for (let i = 0; i < 12 && !made; i++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const r = doc(db, ROOMS, c);
      made = await runTransaction(db, async tx => {
        const s = await tx.get(r);
        if (s.exists()) {
          const d = s.data();
          const age = Date.now() - (d.updatedAt ? d.updatedAt.toMillis() : 0);
          if (d.status !== 'closed' && age < STALE_MS) return null;   // 쓰는 중인 방
        }
        tx.set(r, {
          code: c, status: 'waiting', rule: renju ? 'renju' : 'free', timer,
          hostId: myId, hostName: name, guestId: '', guestName: '', hostColor: 'b',
          board: EMPTY_BOARD, turn: 'b', tick: 0, round: 1, moveNo: 0, last: -1,
          winner: '', winLine: [], endReason: '', lastEvent: 'create', left: '',
          again: { host: false, guest: false }, hb: { host: 0, guest: 0 },
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        return c;
      });
    }
    if (!made) throw new Error('full');
    enterRoom(made, 'host');
    cleanupOld();
  } catch (e) {
    console.error(e); $('startMsg').textContent = '방을 만들지 못했어요. ' + errText(e);
  }
  busy = false; $('createBtn').disabled = false;
};

$('codeInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('joinBtn').onclick = async () => {
  const name = getName(); if (!name || busy) return;
  const c = $('codeInput').value;
  if (!/^\d{4}$/.test(c)) { $('startMsg').textContent = '방 코드 숫자 4개를 적어 주세요.'; return; }
  busy = true; $('joinBtn').disabled = true; $('startMsg').textContent = '';
  try { const r = await joinRoom(c, name); if (r) enterRoom(c, r); }
  catch (e) {
    console.error(e);
    $('startMsg').textContent = e.message === 'none' ? `${c}번 방이 없어요. 번호를 다시 확인해 주세요.`
      : e.message === 'closed' ? `${c}번 방은 이미 닫혔어요.` : '들어가지 못했어요. ' + errText(e);
  }
  busy = false; $('joinBtn').disabled = false;
};

async function joinRoom(c, name) {
  const r = doc(db, ROOMS, c);
  return runTransaction(db, async tx => {
    const s = await tx.get(r);
    if (!s.exists()) throw new Error('none');
    const d = s.data();
    const age = Date.now() - (d.updatedAt ? d.updatedAt.toMillis() : 0);
    if (d.hostId === myId) return 'host';
    if (d.guestId === myId) { if (name && name !== d.guestName) tx.update(r, { guestName: name }); return 'guest'; }
    if (d.status === 'closed' || age > STALE_MS) throw new Error('closed');
    if (d.status === 'waiting' && !d.guestId) {
      if (age > 2.5 * 60 * 1000) throw new Error('closed');  // 방장이 떠난 지 오래된 방
      tx.update(r, { guestId: myId, guestName: name || '친구', status: 'choosing', tick: increment(1), lastEvent: 'join', updatedAt: serverTimestamp() });
      return 'guest';
    }
    return 'watch';
  });
}

function enterRoom(c, r) {
  code = c; role = r; ref = doc(db, ROOMS, c);
  sstore('omok-room', c);
  room = null; tickKey = ''; passSent = ''; selected = -1; shownResultFor = ''; lastMoveSeen = '';
  otherHb = null; otherSeenAt = Date.now(); lastStk = null;
  if (unsub) unsub();
  unsub = onSnapshot(ref, snap => onRoom(snap), e => { console.error(e); toast('연결이 끊겼어요. ' + errText(e), 3000); });
  clearInterval(hbTimer);
  if (role !== 'watch') {
    hbTimer = setInterval(() => {
      if (!room || room.status === 'closed' || (room.status === 'done' && room.left)) return;
      updateDoc(ref, { ['hb.' + role]: increment(1), updatedAt: serverTimestamp() }).catch(() => {});
    }, 20000);
  }
}

function leaveRoomLocal() {
  if (unsub) unsub(); unsub = null;
  clearInterval(hbTimer);
  sstore('omok-room', null);
  code = ref = room = role = null;
  $('resultModal').classList.add('hidden'); $('stkTray').classList.add('hidden');
  show('startScreen');
}

// ============================================================
//  방 상태가 바뀔 때
// ============================================================
function onRoom(snap) {
  if (!snap.exists()) { toast('방이 사라졌어요.', 2500); leaveRoomLocal(); return; }
  const prev = room;
  room = snap.data();
  const k = keyOf(room);
  if (k !== tickKey) {
    tickKey = k; tickStart = Date.now(); selected = -1;
    if (prev && room.lastEvent === 'timeout' && room.status === 'playing') toast('⏱ 시간이 다 되어 차례가 넘어갔어요');
  }
  // 상대 연결 확인
  if (role !== 'watch') {
    const ohb = room.hb ? room.hb[role === 'host' ? 'guest' : 'host'] : 0;
    if (ohb !== otherHb) { otherHb = ohb; otherSeenAt = Date.now(); }
  }
  // 새 응원 스티커
  const st = room.stk;
  if (st && st.id !== (lastStk && lastStk.id)) { if (prev && lastStk !== null) showSticker(st); }
  lastStk = st || { id: '' };
  // 새로 둔 돌 소리
  const mk = `${room.round}-${room.moveNo}`;
  if (mk !== lastMoveSeen) { if (lastMoveSeen && room.moveNo > 0) beep('stone'); lastMoveSeen = mk; }

  if (room.status === 'closed') {
    if (role !== 'host') toast('방장이 방을 닫았어요.', 2500);
    leaveRoomLocal(); return;
  }
  if (room.status === 'waiting') {
    if (role === 'host') showWait();
    else { show('game'); render(); }
    return;
  }
  if (prev && prev.status === 'waiting' && room.status !== 'waiting') beep('join');
  if (!$('game').classList.contains('hidden') === false) show('game');
  render();
  if (room.status === 'done') showResult();
  else { $('resultModal').classList.add('hidden'); shownResultFor = ''; }
  // 선 정하기: 방장(한 화면 모드는 이 기기)이 고름
  if (room.status === 'choosing' && (role === 'host' || role === 'local')) showChoose();
  else $('chooseModal').classList.add('hidden');
}
function showChoose() {
  const hn = room.hostName || '방장', gn = room.guestName || '친구';
  const local = role === 'local';
  $('chText').textContent = (room.round || 1) > 1 ? `${room.round}번째 판이에요. 먼저 두는 사람이 흑이에요.` : '먼저 두는 사람이 흑이에요.';
  $('chHost').textContent = local ? hn : `나 (${hn})`;
  $('chGuest').textContent = local ? gn : gn;
  $('chooseModal').classList.remove('hidden');
}
async function chooseFirst(who) {
  $('chooseModal').classList.add('hidden');
  if (who === 'random') who = Math.random() < .5 ? 'host' : 'guest';
  try {
    await txRun(async tx => {
      const s = await tx.get(ref); const d = s.data();
      if (!d || d.status !== 'choosing') return;
      tx.update(ref, { status: 'playing', hostColor: who === 'host' ? 'b' : 'w', turn: 'b', tick: (d.tick || 0) + 1, lastEvent: 'start', updatedAt: serverTimestamp() });
    });
  } catch (e) { console.error(e); toast('시작하지 못했어요. ' + errText(e), 2500); if (room && room.status === 'choosing') showChoose(); }
}
$('chHost').onclick = () => chooseFirst('host');
$('chGuest').onclick = () => chooseFirst('guest');
$('chRandom').onclick = () => chooseFirst('random');

function ruleTags(d) {
  return `<span class="tag">${d.rule === 'renju' ? '공식 규칙 (렌주)' : '쉬운 규칙'}</span><span class="tag">${d.timer ? '한 수 1분' : '시간 제한 없음'}</span>`;
}
function showWait() {
  show('waitScreen');
  $('codeBig').innerHTML = code.split('').map(ch => `<span>${ch}</span>`).join('');
  $('waitTags').innerHTML = ruleTags(room);
}
$('cancelWaitBtn').onclick = async () => {
  try { await updateDoc(ref, { status: 'closed', updatedAt: serverTimestamp() }); } catch (e) {}
  leaveRoomLocal();
};

// ============================================================
//  화면 그리기
// ============================================================
function render() {
  if (!room) return;
  const hc = room.hostColor || 'b';
  $('nmB').innerHTML = esc(nameOf('b')) + (role !== 'local' && myColor() === 'b' ? '<span class="me">나</span>' : '');
  $('nmW').innerHTML = room.status === 'waiting' ? '<span class="dots">기다리는 중</span>' : esc(nameOf('w')) + (role !== 'local' && myColor() === 'w' ? '<span class="me">나</span>' : '');
  const playing = room.status === 'playing';
  if (playing) { KBGM.full(); bgmJingled = false; } else KBGM.calm();
  $('pB').classList.toggle('turn', playing && room.turn === 'b');
  $('pW').classList.toggle('turn', playing && room.turn === 'w');
  $('sideCode').textContent = code; $('sideRoom').classList.toggle('hidden', role === 'local');
  $('sideRule').innerHTML = (room.rule === 'renju' ? '공식 규칙' : '쉬운 규칙') + ' · ' + (room.timer ? '1분' : '시간 무제한');
  // 연결 끊김 표시
  document.querySelectorAll('.pcard .off').forEach(e => e.remove());
  if (role !== 'watch' && role !== 'local' && room.status !== 'waiting' && Date.now() - otherSeenAt > 75000) {
    const oc = other(myColor());
    const el = document.createElement('span'); el.className = 'off'; el.textContent = '연결 끊김?';
    $(oc === 'b' ? 'pB' : 'pW').appendChild(el);
  }
  // 금수 자리
  const mine = myColor();
  if (playing && room.rule === 'renju' && mine === 'b' && room.turn === 'b') {
    const fk = tickKey + room.board;
    if (fk !== forbidKey) { forbidKey = fk; forbidMap = allForbidden(room.board); }
  } else { forbidMap = new Map(); forbidKey = ''; }
  renderStatus(); renderActions(); updTimer(); draw();
}
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderStatus() {
  const st = $('status'), mine = myColor();

const cv = $('board'), cx = cv.getContext('2d');
let S = 300, cell = 20, pad = 16, dpr = 1;
function layout() {
  const g = $('game');
  if (g.classList.contains('hidden')) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const mobile = matchMedia('(max-width:760px), (pointer:coarse)').matches;
  const used = (mobile ? 44 + 8 : 56 + 12) + $('players').offsetHeight + $('status').offsetHeight + 62 + (mobile ? 21 : 30) + 14;
  S = Math.floor(Math.max(200, Math.min(vw - (mobile ? 18 : 40), vh - used, 720)));
  cell = S / (N - 1 + 1.6); pad = cell * .8;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
  cv.style.width = S + 'px'; cv.style.height = S + 'px';
  $('players').style.maxWidth = Math.max(S, 320) + 'px';
  draw();
}
window.addEventListener('resize', layout);
const P = i => pad + i * cell;
let grain = null;
function drawWood() {
  const g = cx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#f2c97f'); g.addColorStop(1, '#dea65b');
  cx.fillStyle = g; cx.fillRect(0, 0, S, S);
  if (!grain) { grain = []; let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280; for (let i = 0; i < 26; i++) grain.push([rnd(), rnd() * .6 + .2, rnd()]); }

}
function draw() {
  if (!cv.width) return;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWood();
  cx.strokeStyle = '#6b4523'; cx.lineWidth = Math.max(1, cell * .045);
  cx.beginPath();
  for (let i = 0; i < N; i++) { cx.moveTo(P(0), P(i)); cx.lineTo(P(N - 1), P(i)); cx.moveTo(P(i), P(0)); cx.lineTo(P(i), P(N - 1)); }
  cx.stroke();
  cx.lineWidth = Math.max(1.5, cell * .09); cx.strokeRect(P(0), P(0), P(N - 1) - P(0), P(N - 1) - P(0));
  cx.fillStyle = '#6b4523';
  for (const [a, b] of [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]]) { cx.beginPath(); cx.arc(P(a), P(b), cell * .14, 0, 7); cx.fill(); }
  if (!room) return;
  const bd = room.board, R = cell * .47;
  // 이긴 줄 빛
  const wl = room.status === 'done' && room.winLine ? new Set(room.winLine) : null;
  if (wl) for (const i of wl) {
    const x = P(i % N), y = P(Math.floor(i / N));
    cx.fillStyle = 'rgba(255,230,90,.75)'; cx.beginPath(); cx.arc(x, y, R * 1.32, 0, 7); cx.fill();
  }
  for (let i = 0; i < N * N; i++) {
    const c = bd[i]; if (c === '.') continue;
    const x = P(i % N), y = P(Math.floor(i / N));
    cx.fillStyle = 'rgba(60,30,10,.25)'; cx.beginPath(); cx.arc(x + R * .1, y + R * .16, R, 0, 7); cx.fill();
    const im = c === 'b' ? imgB : imgW;
    if (im.complete && im.naturalWidth) cx.drawImage(im, x - R, y - R, R * 2, R * 2);
    else { cx.fillStyle = c === 'b' ? '#111' : '#f4f0ea'; cx.beginPath(); cx.arc(x, y, R, 0, 7); cx.fill(); }
  }
  // 마지막 수 표시
  if (room.last >= 0 && bd[room.last] !== '.') {
    const x = P(room.last % N), y = P(Math.floor(room.last / N));
    cx.fillStyle = '#ee5a6f'; cx.strokeStyle = '#fff'; cx.lineWidth = Math.max(1, cell * .06);
    cx.beginPath(); cx.arc(x, y, cell * .14, 0, 7); cx.fill(); cx.stroke();
  }
  // 금수 표시
  for (const [i] of forbidMap) {
    const x = P(i % N), y = P(Math.floor(i / N)), r = cell * .2;
    cx.strokeStyle = '#d63a4f'; cx.lineWidth = Math.max(2, cell * .1); cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(x - r, y - r); cx.lineTo(x + r, y + r); cx.moveTo(x + r, y - r); cx.lineTo(x - r, y + r); cx.stroke();
  }
  // 놓을 자리 미리 보기
  const mine = myColor();
  const g = selected >= 0 ? selected : hover;
  if (g >= 0 && room.status === 'playing' && mine && room.turn === mine && bd[g] === '.' && !forbidMap.has(g)) {
    const x = P(g % N), y = P(Math.floor(g / N));
    cx.globalAlpha = selected >= 0 ? .85 : .5;
    const im = mine === 'b' ? imgB : imgW;
    if (im.complete && im.naturalWidth) cx.drawImage(im, x - R, y - R, R * 2, R * 2);
    cx.globalAlpha = 1;
    if (selected >= 0) {
      cx.strokeStyle = '#ee5a6f'; cx.lineWidth = Math.max(2, cell * .1);

  }
}

}

async function tryPlace(i) {
  if (busy || !room) return;
  const mine = myColor(), expected = tickKey;
  busy = true; selected = -1; hover = -1;
  try {
    await txRun(async tx => {
      const s = await tx.get(ref); const d = s.data();
      if (!d || d.status !== 'playing' || d.turn !== mine || keyOf(d) !== expected) throw new Error('turn');
      if (d.board[i] !== '.') throw new Error('taken');
      const bd = d.board.split('');
      const x = i % N, y = Math.floor(i / N);
      const renju = d.rule === 'renju';
      if (renju && mine === 'b' && isForbidden(bd, x, y)) throw new Error('forbid');
      put(bd, x, y, mine);
      const line = winLine(bd, x, y, mine, renju);
      const full = !bd.includes('.');
      const up = { board: bd.join(''), last: i, moveNo: (d.moveNo || 0) + 1, tick: (d.tick || 0) + 1, turn: other(mine), lastEvent: 'move', updatedAt: serverTimestamp() };
      if (line) Object.assign(up, { status: 'done', winner: mine, winLine: line, endReason: 'five' });
      else if (full) Object.assign(up, { status: 'done', winner: 'draw', winLine: [], endReason: 'full' });
      tx.update(ref, up);
    });
  } catch (e) {
    if (e.message === 'forbid') { beep('bad'); toast('❌ 금지된 자리예요', 2000); }
    else if (e.message !== 'turn' && e.message !== 'taken') { console.error(e); toast('돌을 두지 못했어요. ' + errText(e), 2600); }
  }
  busy = false; render();
}

  const left = Math.max(0, TURN_SEC - Math.floor((Date.now() - tickStart) / 1000));

    const el = (Date.now() - tickStart) / 1000;
    // 내 차례면 60초에, 상대 차례면 (상대가 사라졌을 때를 위해) 64초에 차례를 넘김

    await runTransaction(db, async tx => {
      const s = await tx.get(rf); const d = s.data(); if (!d) return;
      if (d.status === 'playing' || d.status === 'choosing') tx.update(rf, { status: 'done', winner: other(myC), winLine: [], endReason: 'leave', left: r, updatedAt: serverTimestamp() });
      else if (d.status === 'waiting') tx.update(rf, { status: 'closed', updatedAt: serverTimestamp() });
      else tx.update(rf, { left: r, updatedAt: serverTimestamp() });
    });
  } catch (e) {}
};

// ---------- 새로 고침해도 방으로 돌아오기 ----------
(async () => {
  const c = sstore('omok-room');
  if (!c) return;
  try { const r = await joinRoom(c, store('omok-name') || ''); if (r) enterRoom(c, r); }
  catch (e) { sstore('omok-room', null); }
})();
window.addEventListener('pointerdown', () => { if (actx && actx.state === 'suspended') actx.resume(); }, { passive: true });
</script>
