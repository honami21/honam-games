<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="꼬비샘과 쉬는 시간"/>
<meta name="theme-color" content="#2a2860"/>
<title>꼬비샘과 쉬는 시간</title>
<link rel="preload" as="image" href="img/bg.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#fff6e4;--line:#3a2b33;--ink:#2c2950;--coral:#f2685f;--yellow:#ffd75e;--night:#2a2860}
html{background:var(--night)}
body{font-family:'Jua',sans-serif;color:var(--ink);min-height:100vh;padding:28px 20px 48px;position:relative;overflow-x:hidden;
  background:#2a2860 url(img/bg.jpg) center top/cover no-repeat fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(30,26,80,.15),rgba(30,26,80,0) 40%,rgba(30,26,80,.25))}
.page{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 230px;grid-template-areas:"head head head" "char cards .";column-gap:12px;align-items:end;position:relative}
header{grid-area:head;text-align:center;position:relative;padding:40px 0 30px}
.logo{display:block;width:min(720px,92%);height:auto;margin:0 auto;filter:drop-shadow(0 6px 0 rgba(20,16,60,.35))}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{color:#fff;font-size:22px;margin-top:10px;text-shadow:0 2px 0 rgba(20,16,60,.6),0 0 12px rgba(20,16,60,.6);letter-spacing:.5px}
.char{grid-area:char;align-self:end;width:100%;height:auto;margin-bottom:-6px;transform-origin:50% 100%;animation:wave 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(10,8,40,.45))}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg) translateY(-4px)}}
.grid{grid-area:cards;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;max-width:1000px;width:100%;justify-self:center}
.game,.soon{position:relative;display:flex;flex-direction:column;background:var(--cream);border:3px solid var(--line);border-radius:28px;padding:14px 14px 16px;
  box-shadow:0 6px 0 rgba(58,43,51,.55),0 14px 28px rgba(10,8,40,.35);text-decoration:none;color:inherit}
.game{transition:transform .15s}
.game:hover,.game:focus-visible{transform:translateY(-5px) rotate(-.4deg)}
.game:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}
.game img{display:block;width:100%;aspect-ratio:10/9;object-fit:cover;border-radius:18px;background:#1d1c48}
.title{display:flex;align-items:center;justify-content:center;margin:14px 0 8px;container-type:inline-size}
.title b{font-weight:normal;font-size:24px;font-size:clamp(14px,7.2cqw,24px);background:var(--yellow);border-radius:999px;padding:5px 16px 3px;box-shadow:inset 0 -3px 0 rgba(200,140,20,.25);white-space:nowrap}
.game p{text-align:center;font-size:15px;color:#3d3446;word-break:keep-all;text-wrap:balance}
.soon{justify-content:center;align-items:center;min-height:300px;overflow:hidden}
.soon::before{content:"";position:absolute;inset:12px;border:3px dashed #b9a99a;border-radius:20px}
.soon span{font-size:26px;color:#7a6a63;margin-bottom:40px}
.soon img{position:absolute;left:0;right:0;margin:0 auto;bottom:15px;width:29%;max-width:100px;height:auto;animation:peek 4s ease-in-out infinite}
@keyframes peek{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(8px)}}
.wisp{position:absolute;width:44px;height:auto;pointer-events:none;opacity:.95;filter:drop-shadow(0 0 14px rgba(255,220,110,.85));animation:float 5s ease-in-out infinite}
.w1{left:6%;top:18%}.w2{right:8%;top:6%;width:36px;animation-delay:-1.6s}.w3{right:2%;top:62%;width:30px;animation-delay:-3s}.w4{left:16%;top:70%;width:26px;animation-delay:-2.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.char,.wisp,.soon img{animation:none}}
/* ====== TOP BAR (전체화면) ====== */
.topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:flex-end;pointer-events:none}
.topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:6px 16px;
  font-family:'Jua',sans-serif;font-size:17px;color:var(--ink);background:var(--yellow);box-shadow:none;text-decoration:none;cursor:pointer}
.topbar a:hover,.topbar button:hover{filter:brightness(1.05)}
.topbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* 태블릿: 캐릭터 조금 작게 */
@media (max-width:1300px){.page{grid-template-columns:180px minmax(0,1fr) 120px}}
@media (max-width:1000px){.page{grid-template-columns:160px minmax(0,1fr) 0}}
/* 휴대폰: 캐릭터는 제목 옆, 카드는 한 줄씩 */
@media (max-width:760px){
  body{padding:16px 16px 36px;background-attachment:scroll;background-size:auto 100vh;background-position:30% top}
  .page{grid-template-columns:96px 1fr;grid-template-areas:"char head" "cards cards";column-gap:6px;align-items:center}
  header{padding:30px 0 18px}
  .logo{width:100%}
  .sub{font-size:15px;margin-top:6px}
  .char{align-self:center;margin:24px 0 14px}
  .grid{grid-template-columns:1fr;gap:18px}
  .game img{aspect-ratio:4/3;object-position:center top}
  .soon{min-height:190px}
  .soon img{width:70px}
  .soon span{margin:0 0 20px;font-size:22px}
  .wisp{width:28px}.w3,.w4{display:none}
}
@media (max-width:760px), (pointer:coarse){
  .topbar{top:6px;left:6px;right:6px}
  .topbar a,.topbar button{font-size:13px;padding:5px 10px;gap:4px;border-width:2px}
  .topbar svg{width:16px;height:16px}
}
.info{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:40px;font-size:15px;color:rgba(255,246,228,.85);text-shadow:0 1px 3px rgba(10,8,40,.8)}
.info a{display:inline-flex;align-items:center;gap:6px;color:#fff6e4;text-decoration:none;background:rgba(30,26,80,.55);border-radius:999px;padding:5px 12px 5px 6px}
.info a:hover{background:rgba(30,26,80,.8)}
.info svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="topbar">
  <button id="fs-btn" type="button" title="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="t" id="fs-txt">전체화면</span></button>
</div>
<script>
(function(){
  var b=document.getElementById('fs-btn'),t=document.getElementById('fs-txt'),d=document,el=d.documentElement;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  var framed=false;try{framed=window.top!==window;}catch(e){framed=true;}
  if(!can){
    if(framed){t.textContent='새 창으로';b.title='새 창으로 크게 열기';b.addEventListener('click',function(){window.open(location.href,'_blank');});}
    else b.style.display='none';
    return;
  }
  var cur=function(){return d.fullscreenElement||d.webkitFullscreenElement;};
  b.addEventListener('click',function(){
    if(cur()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
    b.blur();
  });
  var upd=function(){t.textContent=cur()?'나가기':'전체화면';};
  d.addEventListener('fullscreenchange',upd);d.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<div class="page">
  <header>
    <img class="wisp w1" src="img/wisp.png" alt="">
    <img class="wisp w2" src="img/wisp.png" alt="">
    <img class="wisp w3" src="img/wisp.png" alt="">
    <img class="wisp w4" src="img/wisp.png" alt="">
    <h1>꼬비샘과 쉬는 시간</h1>
    <img class="logo" src="img/logo.png" alt="꼬비샘과 쉬는 시간" width="1100" height="186">
    <p class="sub">쉬는 시간에 친구들과 즐겨 보세요!</p>
  </header>
  <img class="char" src="img/ggobi-wave.png" alt="손을 흔드는 꼬비" width="382" height="640">
  <div class="grid">
    <a class="game" href="tetris/">
      <img src="tetris/thumb.jpg" alt="꼬비꼬비 테트리스 게임 화면">
      <div class="title"><b>꼬비꼬비 테트리스</b></div>
      <p>10단계까지 완주하고 랭킹 TOP 50에 도전!</p>
    </a>
    <a class="game" href="spelling/">
      <img src="spelling/thumb.jpg" alt="꼬비의 한글 맞춤법 대소동 게임 화면">
      <div class="title"><b>꼬비의 한글 맞춤법 대소동</b></div>
      <p>낱말과 빈칸 문장, 옳은 맞춤법 블록을 톡! 50문제에 도전!</p>
    </a>
    <a class="game" href="typing/">
      <img src="typing/thumb.jpg" alt="꼬비의 영어 타자 연습 게임 화면">
      <div class="title"><b>꼬비의 영어 타자 연습</b></div>
      <p>내려오는 영어 단어를 키보드로 톡톡! 컴퓨터에서 즐겨요.</p>
    </a>
    <a class="game" href="flags/">
      <img src="flags/thumb.jpg" alt="꼬비의 국기 맞히기 게임 화면">
      <div class="title"><b>꼬비의 국기 맞히기</b></div>
      <p>국기에 맞는 나라의 유리 다리로 폴짝! 세계 여행을 떠나요.</p>
    </a>
    <a class="game" href="omok/">
      <img src="omok/thumb.jpg" alt="꼬비의 오목 대결 게임 화면">
      <div class="title"><b>꼬비의 오목 대결</b></div>
      <p>방 코드로 친구와 만나 한 수씩! 다섯 개를 먼저 이어요.</p>
    </a>
    <div class="soon">
      <span>새 게임 준비 중</span>
      <img src="img/ggobi-peek.png" alt="" width="440" height="411">
    </div>
  </div>
</div>

  <span>© 꼬비샘</span>

</html>
