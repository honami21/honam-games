<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>꼬비샘 게임방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#fff6ec;--edge:#ecc9b0;--ink:#2c2950;--coral:#ee5a6f}
body{font-family:'Jua',sans-serif;color:var(--ink);min-height:100vh;padding:48px 16px 40px;
  background:radial-gradient(ellipse 60% 45% at 50% 30%,#45428f 0%,transparent 70%),linear-gradient(180deg,#26245a,#33307a 60%,#4a3f86);}
h1{text-align:center;font-size:44px;color:#fff;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 span{color:#ffd25e}
.sub{text-align:center;color:#cfc9f2;margin:10px 0 36px;font-size:17px}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.game{display:block;text-decoration:none;color:inherit;background:var(--cream);border-radius:24px;overflow:hidden;
  box-shadow:0 6px 0 var(--edge),0 12px 26px rgba(0,0,0,.25);transition:transform .15s}
.game:hover{transform:translateY(-4px)}
.game img{display:block;width:100%;aspect-ratio:10/9;object-fit:cover;background:#1d1c48}
.info{padding:14px 18px 18px}
.info b{display:block;font-size:24px;font-weight:normal;color:var(--coral)}
.info p{font-size:15px;color:#6f6585;margin-top:4px}
.soon{display:flex;align-items:center;justify-content:center;min-height:200px;border:3px dashed rgba(255,255,255,.25);border-radius:24px;color:#cfc9f2;font-size:18px}
footer{text-align:center;color:rgba(255,255,255,.5);font-size:13px;margin-top:40px;letter-spacing:1px}
/* ====== TOP BAR (게임방 / 전체화면) ====== */
.topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:flex-end;pointer-events:none}
.topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:20px;padding:7px 14px;
  font-family:'Jua',sans-serif;font-size:16px;color:var(--ink);background:rgba(255,246,236,.92);box-shadow:0 3px 0 var(--edge);text-decoration:none;cursor:pointer}
.topbar a:hover,.topbar button:hover{filter:brightness(1.04)}
.topbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:760px), (pointer:coarse){
  .topbar{top:6px;left:6px;right:6px}
  .topbar a,.topbar button{font-size:12px;padding:7px 8px;gap:0}
  .topbar svg{width:18px;height:18px}
  .topbar .t{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <button id="fs-btn" type="button" title="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="t" id="fs-txt">전체화면</span></button>
</div>
<script>
(function(){
  var b=document.getElementById('fs-btn'),t=document.getElementById('fs-txt'),d=document,el=d.documentElement;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  var framed=false;try{framed=window.top!==window;}catch(e){framed=true;}
  if(!can){
    if(framed){t.textContent='새 창으로';b.title='새 창으로 크게 열기';b.addEventListener('click',function(){window.open(location.href,'_blank');});}
    else b.style.display='none';
    return;
  }
  var cur=function(){return d.fullscreenElement||d.webkitFullscreenElement;};
  b.addEventListener('click',function(){
    if(cur()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}
    b.blur();
  });
  var upd=function(){t.textContent=cur()?'나가기':'전체화면';};
  d.addEventListener('fullscreenchange',upd);d.addEventListener('webkitfullscreenchange',upd);
})();
</script>

<h1>🎮 꼬비샘 <span>게임방</span></h1>
<p class="sub">쉬는 시간에 친구들과 즐겨 보세요!</p>
<div class="grid">
  <a class="game" href="tetris/">
    <img src="tetris/thumb.jpg" alt="냥냥 테트리스 게임 화면">
    <div class="info"><b>냥냥 테트리스</b><p>10단계까지 완주하고 랭킹 TOP 50에 도전!</p></div>
  </a>
  <div class="soon">새 게임 준비 중 🐾</div>
</div>
</body>
</html>
