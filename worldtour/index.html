<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="꼬비샘과 쉬는 시간"/>
<meta name="theme-color" content="#2a2860"/>
<title>꼬비의 세계 여행 - 꼬비샘과 쉬는 시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6ec; --cream2:#f1e2d2; --edge:#ecc9b0; --ink:#2c2950; --ink2:#6f6585;
    --coral:#ee5a6f; --coral-d:#c8455a; --sun:#ffd25e; --sun-d:#d9a92c; --mint:#7ccf74; --mint-d:#3f8f4a; --sky:#8fc7ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a2860 url(../img/bg.jpg) center / cover no-repeat;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink); }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body.hasbg { background-image:url(img/bg.jpg); }
  .hidden { display:none !important; }
  button { font-family:'Jua',sans-serif; }

  /* ===== 상단 바 ===== */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:space-between;pointer-events:none}
  .topbar .right{display:flex;gap:8px}
  .topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:20px;padding:7px 14px;
    font-family:'Jua',sans-serif;font-size:16px;color:var(--ink);background:rgba(255,248,238,.94);text-decoration:none;cursor:pointer;line-height:1.2}
  .topbar a:hover,.topbar button:hover{filter:brightness(1.04)}
  .topbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #sndToggle{padding:7px 10px}
  #sndToggle.muted{opacity:.7}
  .kbgm-btn{padding:7px 10px}

  /* ===== 시작 화면 ===== */
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:58px 16px 16px; z-index:20; overflow-y:auto; background:rgba(30,20,70,.3); }
  .section { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:600px; margin:auto; }
  .card { background:var(--cream); border:3px solid var(--ink); border-radius:28px; box-shadow:0 8px 0 var(--ink), 0 16px 30px rgba(20,10,50,.35);
    padding:20px 24px 24px; width:100%; position:relative; }
  .logo { height:auto; width:min(420px, 92%); display:block; margin:-4px auto 0; }
  .logo-txt { font-size:clamp(34px,7vw,50px); color:var(--coral-d); line-height:1.1; }
  .logo-txt small { display:block; font-size:.5em; color:var(--ink); }
  .lead { font-size:clamp(16px,2.6vw,19px); line-height:1.5; color:var(--ink); margin:8px 0 4px; word-break:keep-all; }
  .lead b { color:var(--coral-d); font-weight:normal; }
  .start-wrap { position:relative; width:100%; }
  .start-ggobi { position:absolute; width:170px; right:-140px; bottom:-10px; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(20,10,50,.25)); }
  @media (max-width:940px){ .start-ggobi{ display:none; } }
  .box { background:#fff; border:2px solid var(--cream2); border-radius:18px; padding:10px 12px 12px; margin-top:12px; text-align:left; }
  .box-title { color:var(--coral-d); font-size:18px; margin-bottom:8px; text-align:center; }
  .slot { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .slot .chip { flex:none; width:34px; height:34px; border-radius:50%; border:3px solid var(--ink); background-size:cover; background-position:center; }
  .slot input { flex:1; min-width:0; padding:8px 12px; border-radius:14px; border:2.5px solid var(--cream2); background:#fff; color:var(--ink);
    font-size:17px; font-family:'Jua',sans-serif; -webkit-user-select:text; user-select:text; outline:none; }
  .slot input:focus { border-color:var(--coral); }
  .slot.off input { opacity:.35; pointer-events:none; }
  .seg { display:flex; flex:none; border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; }
  .seg button { border:none; background:#fff; color:var(--ink); font-size:15px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .seg button + button { border-left:2px solid var(--ink); }
  .seg button.on { background:var(--sun); }
  .segrow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
  .segrow .seg button { padding:8px 14px; font-size:16px; }
  .hint { font-size:14px; color:var(--ink2); text-align:center; margin-top:8px; word-break:keep-all; line-height:1.4; }
  .msg { min-height:20px; font-size:15px; color:var(--coral-d); margin-top:8px; text-align:center; word-break:keep-all; }

  .game-btn { padding:11px 24px; font-size:clamp(17px,2.8vw,20px); border-radius:40px; border:3px solid var(--ink); color:#fff;
    cursor:pointer; min-width:120px; box-shadow:none; transition:transform .08s; white-space:nowrap; }
  .game-btn:active { transform:translateY(2px) scale(.97); }
  .game-btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:var(--coral); }
  .btn-info { background:var(--sun); color:var(--ink); }
  .btn-secondary { background:#fff; color:var(--ink); }
  .btn-mint { background:var(--mint); color:var(--ink); }
  .btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  /* ===== 게임 화면 ===== */
  #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:14px; padding:54px 10px 10px; }
  #side { display:flex; flex-direction:column; gap:8px; width:290px; flex:none; align-self:stretch; min-height:0; }
  #players { display:flex; flex-direction:column; gap:7px; }
  .pcard { display:flex; align-items:center; gap:8px; background:var(--cream); border:3px solid var(--ink); border-radius:16px; padding:5px 10px; position:relative; transition:transform .2s, background .2s; min-width:0; }
  .pcard .chip { flex:none; width:38px; height:38px; border-radius:50%; border:3px solid var(--ink); background-size:cover; background-position:center top; }
  .pcard .nm { font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .sub { font-size:12.5px; color:var(--ink2); white-space:nowrap; }
  .pcard .mn { margin-left:auto; flex:none; font-size:19px; color:var(--coral-d); text-align:right; white-space:nowrap; }
  .pcard .mn small { display:block; font-size:11.5px; color:var(--ink2); }
  .pcard.turn { background:#fff1c9; box-shadow:0 0 0 4px var(--sun); }
  .pcard.out { opacity:.45; filter:grayscale(1); }
  .pcard .delta { position:absolute; right:10px; top:-8px; font-size:18px; pointer-events:none; animation:delta 1.4s ease-out forwards; text-shadow:0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff; }
  .delta.plus { color:var(--mint-d); } .delta.minus { color:var(--coral-d); }
  @keyframes delta { 0%{ opacity:0; transform:translateY(8px) } 15%{ opacity:1; transform:translateY(0) } 75%{ opacity:1 } 100%{ opacity:0; transform:translateY(-16px) } }
  #info { display:flex; gap:6px; flex-wrap:wrap; }
  #info span { background:rgba(255,248,238,.94); border-radius:14px; padding:3px 10px; font-size:14px; white-space:nowrap; }
  #info b { color:var(--coral-d); font-weight:normal; }
  #log { flex:1; min-height:60px; background:rgba(255,248,238,.92); border:3px solid var(--ink); border-radius:16px; padding:8px 10px; overflow-y:auto; font-size:14px; line-height:1.45; word-break:keep-all; }
  #log div { padding:2px 0; border-bottom:1px dashed var(--cream2); }
  #log div:first-child { color:var(--ink); font-size:15px; } #log div { color:var(--ink2); }
  #log i { font-style:normal; }
  #sideBtns { display:flex; gap:6px; }
  #sideBtns button { flex:1; border:2.5px solid var(--ink); border-radius:16px; background:var(--cream); color:var(--ink); font-size:14px; padding:6px 4px; cursor:pointer; white-space:nowrap; }
  #sideBtns button.on { background:var(--sun); }

  #boardWrap { position:relative; flex:none; }
  #board { position:relative; width:100%; height:100%; display:grid; grid-template-columns:1.45fr repeat(9, 1fr) 1.45fr; grid-template-rows:1.45fr repeat(9, 1fr) 1.45fr;
    background:#1f1d4a; border:4px solid var(--ink); border-radius:calc(var(--u) * 2.2); gap:calc(var(--u) * .28); padding:calc(var(--u) * .28); box-shadow:0 16px 30px rgba(20,10,50,.4); }
  .tile { position:relative; background:var(--cream); border-radius:calc(var(--u) * .8); overflow:hidden; display:flex; cursor:pointer; min-width:0; min-height:0; }
  .tile .band { flex:none; background:var(--g, transparent); }
  .tile .body { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; padding:calc(var(--u) * .2); }
  .tile.sb { flex-direction:column; } .tile.st { flex-direction:column-reverse; }
  .tile.sl { flex-direction:row-reverse; } .tile.sr { flex-direction:row; }
  .tile.sb .band, .tile.st .band { height:calc(var(--u) * 1.7); }
  .tile.sl .band, .tile.sr .band { width:calc(var(--u) * 1.7); }
  .tile .pic { font-size:calc(var(--u) * 2.5); line-height:1; }
  .tile .pic img { width:calc(var(--u) * 4.2); height:calc(var(--u) * 4.2); object-fit:contain; display:block; }
  .tile.sl .pic img, .tile.sr .pic img { width:calc(var(--u) * 3.4); height:calc(var(--u) * 3.4); }
  .tile .nm { font-size:calc(var(--u) * 1.9); line-height:1.05; color:var(--ink); word-break:keep-all; }
  .tile .pr { font-size:calc(var(--u) * 1.55); margin-top:calc(var(--u) * .3); color:var(--ink2); line-height:1.1; }
  .tile.own { background:var(--ot); box-shadow:inset 0 0 0 calc(var(--u) * .45) var(--oc); }
  .tile.own .pr { color:var(--coral-d); }
  .tile .bld { position:absolute; right:calc(var(--u) * .3); top:calc(var(--u) * .2); font-size:calc(var(--u) * 2.1); line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.3)); }
  .tile .bld img { width:calc(var(--u) * 3); height:calc(var(--u) * 3); display:block; }
  .tile.sl .bld, .tile.sr .bld { top:auto; bottom:calc(var(--u) * .2); }
  .tile.lm .bld { font-size:calc(var(--u) * 3); animation:lmglow 1.6s ease-in-out infinite alternate; }
  .tile.lm .bld img { width:calc(var(--u) * 4.6); height:calc(var(--u) * 4.6); }
  .tile.lm { box-shadow:inset 0 0 0 calc(var(--u) * .45) var(--oc), inset 0 0 calc(var(--u) * 2.5) calc(var(--u) * .6) var(--sun); }
  @keyframes lmglow { to { filter:drop-shadow(0 0 calc(var(--u) * .8) #ffd25e) } }
  .tile.corner { background:#fff1c9; }
  .tile.corner .pic { font-size:calc(var(--u) * 5); }
  .tile.corner .pic img { width:calc(var(--u) * 8); height:calc(var(--u) * 8); }
  .tile.corner .nm { font-size:calc(var(--u) * 1.75); }
  .tile.t-card { background:#e8e0ff; } .tile.t-give { background:#ffe3ea; } .tile.t-mark { background:#e0f4ff; }
  .tile.pick { animation:pick .7s ease-in-out infinite alternate; z-index:3; }
  .tile.nopick { opacity:.4; }
  @keyframes pick { from{ box-shadow:inset 0 0 0 calc(var(--u) * .5) var(--sun) } to{ box-shadow:inset 0 0 0 calc(var(--u) * .5) var(--coral) } }
  .tile.here { animation:here .5s ease-out; }
  @keyframes here { 0%{ transform:scale(1) } 40%{ transform:scale(1.12); z-index:4 } 100%{ transform:scale(1) } }

  #center { grid-column:2 / 11; grid-row:2 / 11; position:relative; border-radius:calc(var(--u) * 1.2); overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u) * 1.6);
    background:radial-gradient(circle at 50% 40%, #4a47a0, #2a2860 75%); padding:calc(var(--u) * 2); }
  #center.art { background:url(img/board-center.jpg) center / cover no-repeat; }
  #cLogo { width:62%; max-height:26%; object-fit:contain; pointer-events:none; }
  #cTitle { font-size:calc(var(--u) * 6); color:var(--sun); text-shadow:0 calc(var(--u) * .4) 0 var(--ink); line-height:1; }
  #cTitle small { display:block; font-size:.5em; color:#fff; text-align:center; }
  #status { min-height:calc(var(--u) * 7); display:flex; align-items:center; justify-content:center; font-size:calc(var(--u) * 2.9); color:#fff; text-shadow:0 2px 0 rgba(20,10,50,.8); text-align:center; word-break:keep-all; line-height:1.3; padding:0 2%; }
  #status b { color:var(--sun); font-weight:normal; }
  #diceRow { display:flex; gap:calc(var(--u) * 4); perspective:calc(var(--u) * 60); height:calc(var(--u) * 11); align-items:center; }
  .die { --d:calc(var(--u) * 9); width:var(--d); height:var(--d); position:relative; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.8,.3,1); }
  .die .f { position:absolute; inset:0; outline:1px solid transparent; background:#fff; border:calc(var(--u) * .35) solid var(--ink); border-radius:18%; display:grid; grid-template:repeat(3, 1fr) / repeat(3, 1fr); padding:14%; backface-visibility:hidden; }
  .die .f i { width:70%; height:70%; border-radius:50%; background:var(--ink); align-self:center; justify-self:center; }
  .die .f.one i { background:var(--coral); width:100%; height:100%; }
  .die .f1 { transform:translateZ(calc(var(--d) / 2)); } .die .f6 { transform:rotateY(180deg) translateZ(calc(var(--d) / 2)); }
  .die .f3 { transform:rotateY(90deg) translateZ(calc(var(--d) / 2)); } .die .f4 { transform:rotateY(-90deg) translateZ(calc(var(--d) / 2)); }
  .die .f2 { transform:rotateX(90deg) translateZ(calc(var(--d) / 2)); } .die .f5 { transform:rotateX(-90deg) translateZ(calc(var(--d) / 2)); }
  #diceRow.jump .die { animation:djump .9s ease-out; }
  @keyframes djump { 0%{ top:0 } 30%{ top:calc(var(--u) * -6) } 60%{ top:0 } 75%{ top:calc(var(--u) * -1.6) } 100%{ top:0 } }
  #rollBtn { font-size:calc(var(--u) * 3.2); padding:calc(var(--u) * 1.4) calc(var(--u) * 4.5); min-width:0; }
  #rollBtn.pulse { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50%{ transform:scale(1.07) } }

  #pieces { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .piece { position:absolute; width:calc(var(--u) * 5.2); height:calc(var(--u) * 5.2); margin:calc(var(--u) * -2.6) 0 0 calc(var(--u) * -2.6); transition:left .17s linear, top .17s linear; filter:drop-shadow(0 calc(var(--u) * .5) 0 rgba(20,10,50,.35)); }
  .piece.fly { transition:left .8s cubic-bezier(.5,0,.3,1), top .8s cubic-bezier(.5,0,.3,1); }
  .piece .in { width:100%; height:100%; border-radius:50%; border:calc(var(--u) * .75) solid var(--pc); background:var(--pc) center top / cover no-repeat; box-shadow:0 0 0 calc(var(--u) * .3) var(--ink); }
  .piece.img .in { border:none; border-radius:0; box-shadow:none; background-color:transparent; background-size:contain; background-position:center; transform:scale(1.35); transform-origin:50% 80%; }
  .piece.hop .in { animation:hop .17s ease-out; }
  @keyframes hop { 50%{ transform:translateY(calc(var(--u) * -2.2)) } }
  .piece.cur { z-index:2; } .piece.cur .in { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 50%{ transform:translateY(calc(var(--u) * -1)) } }
  .piece.out { display:none; }

  /* 알림 창 */
  .modal { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(30,20,70,.4); }
  .modal .card { max-width:430px; text-align:center; max-height:calc(100vh - 32px); overflow-y:auto; animation:pop .22s ease-out; }
  @keyframes pop { from{ transform:scale(.85); opacity:0 } }
  .modal h2 { font-size:clamp(24px,5vw,30px); font-weight:normal; color:var(--coral-d); }
  .modal p { font-size:17px; line-height:1.5; color:var(--ink); margin-top:6px; word-break:keep-all; }
  .modal p b { color:var(--coral-d); font-weight:normal; }
  .modal .big { font-size:54px; line-height:1.1; }
  .modal .big img { width:120px; height:120px; object-fit:contain; }
  .modal .res-img { width:140px; display:block; margin:0 auto; }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .choices .game-btn { width:100%; white-space:normal; word-break:keep-all; padding:9px 14px; font-size:17px; display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left; }
  .choices .game-btn span:last-child { flex:none; }
  table.toll { width:100%; border-collapse:collapse; margin-top:10px; font-size:15px; }
  table.toll td { padding:4px 6px; border-bottom:1px dashed var(--cream2); text-align:left; } table.toll td:last-child { text-align:right; color:var(--coral-d); }
  table.toll tr.now td { background:#fff1c9; }
  .gband { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-1px; margin-right:4px; border:2px solid var(--ink); }
  .cardface { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:14px 12px; margin-top:10px; font-size:19px; line-height:1.45; word-break:keep-all; }
  .rank { text-align:left; margin-top:10px; }
  .rank div { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:12px; font-size:17px; }
  .rank div:first-child { background:#fff1c9; }
  .rank .chip { width:28px; height:28px; border-radius:50%; border:2.5px solid var(--ink); flex:none; background-size:cover; background-position:center top; }
  .rank span:last-child { margin-left:auto; color:var(--coral-d); }

  #toast { position:fixed; left:50%; top:16%; transform:translate(-50%,-50%); z-index:45; background:var(--cream); border:3px solid var(--ink); border-radius:20px;
    padding:8px 18px; font-size:18px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .25s; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #toast.show { opacity:1; }

  /* 세로 화면 (휴대폰) */
  body.tall #game { flex-direction:column; gap:6px; padding:44px 4px 6px; justify-content:flex-start; }
  body.tall #side { width:100%; align-self:auto; flex:1; min-height:0; }
  body.tall #players { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  body.tall .pcard { padding:3px 7px; gap:6px; border-width:2.5px; border-radius:12px; }
  body.tall .pcard .chip { width:28px; height:28px; border-width:2px; }
  body.tall .pcard .nm { font-size:14px; } body.tall .pcard .sub { font-size:11px; } body.tall .pcard .mn { font-size:15px; } body.tall .pcard .mn small { display:none; }
  body.tall #log { min-height:34px; font-size:13px; border-width:2.5px; border-radius:12px; padding:4px 8px; }
  body.tall #info span { font-size:12.5px; padding:2px 8px; }
  body.tall #sideBtns button { font-size:13px; padding:5px 4px; }
  @media (max-width:760px), (pointer:coarse){
    .topbar{top:6px;left:6px;right:6px}
    .topbar a,.topbar button{font-size:13px;padding:6px 10px;gap:4px}
    .topbar .t{display:none}
    .card { padding:16px 14px 18px; border-radius:24px; }
    .seg button { padding:7px 8px; font-size:14px; }
    .segrow .seg button { padding:8px 9px; font-size:14.5px; }
  }
  @media (max-height:520px){ #game { padding-top:44px; } #side { width:230px; } .pcard .chip { width:28px; height:28px; } .pcard { padding:3px 8px; } #log { display:none; } }
  .game-btn, .topbar a, .topbar button { box-shadow:none !important; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../" id="home-link" title="꼬비샘과 쉬는 시간으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="t">쉬는 시간</span></a>
  <div class="right">
    <button id="sndToggle" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
    <button id="fs-btn" type="button" title="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="t" id="fs-txt">전체화면</span></button>
  </div>
</div>
<script>
(function(){
  var b=document.getElementById('fs-btn'),t=document.getElementById('fs-txt'),d=document,el=d.documentElement;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;

async function pay(p, amount, to, why) { // to: 다른 사람, 'pot', null(은행)

    else while (p.money < amount) {
      const list = owned(p);
      const i = await ask('<div class="big">' + (IMG['ggobi-sad'] ? '<img src="' + IMG['ggobi-sad'] + '">' : '😢') + '</div><h2>돈이 모자라요</h2><p>' + why + ' <b>' + nf(amount) + '냥</b>을 내야 해요.<br>지금 ' + nf(p.money) + '냥, <b>' + nf(amount - p.money) + '냥</b>이 더 필요해요. 팔 곳을 골라요.</p>',
        list.map(i => ({ label:(LV_EMO[G.level[i]] || '🚩') + ' ' + TILES[i].name, right:'+' + nf(sellValue(i)) + '냥', v:i })));
      sell(p, i);
    }
  }
  money(p, -amount); beep('pay');
  if (to === 'pot') G.pot += amount; else if (to) money(to, amount);
  refresh(); return true;
}
async function bankrupt(p, to, why) {
  beep('bad');
  let total = p.money; owned(p).forEach(i => { total += sellValue(i); G.owner[i] = null; G.level[i] = 0; });
  p.money = 0; p.alive = false; p.balloon = false; p.island = 0;
  if (to === 'pot') G.pot += total; else if (to) money(to, total);
  say(pn(p) + ' 파산했어요!'); refresh();
  await notice(p.ai ? p : { ai:false }, '<div class="big">' + (IMG['ggobi-sad'] ? '<img src="' + IMG['ggobi-sad'] + '">' : '😭') + '</div><h2>' + esc(p.name) + ' 파산!</h2><p>' + why + ' 낼 돈이 모자라 여행을 마쳐요.' + (to && to !== 'pot' ? '<br>남은 ' + nf(total) + '냥은 ' + pn(to) + '에게 가요.' : '') + '</p>', 2200);
}

// ---------- 칸에 도착했을 때 ----------
function aiPickLevel(p, i, from, isNew) {
  const reserve = Math.min(500, 150 + owned(p).length * 40); let best = -1;
  for (let l = (isNew ? 0 : from + 1); l <= (isNew ? 0 : from === 3 ? 4 : 3); l++) { const c = (isNew ? cumCost(i, l) : upCost(i, from, l)); if (p.money - c >= reserve) best = l; }
  if (best < 0 && isNew && p.money - TILES[i].price >= 80) best = 0;
  return best;
}
async function land(p) {
  const i = p.pos, t = TILES[i];
  if (t.type === 'city' || t.type === 'mark') {
    const o = G.owner[i];
    if (o == null) {
      if (p.money < t.price) { say(pn(p) + ' ' + t.name + ' 도착. 살 돈이 모자라요.'); await wait(900); return; }
      let lv;
      if (p.ai) { say(pn(p) + ' ' + t.name + ' 도착. 살까 말까…', true); await wait(900); lv = aiPickLevel(p, i, 0, true); }
      else {
        const max = 0, ch = [];
        for (let l = 0; l <= max; l++) ch.push({ label:(LV_EMO[l] || '🚩') + ' ' + (t.type === 'mark' ? '명소 사기' : '땅 사기') + ' <small style="color:var(--ink2)">(통행료 ' + nf(t.type === 'mark' ? MARK_TOLL[Math.min(4, owned(p).filter(j => TILES[j].type === 'mark').length + 1)] : toll(i, l)) + ')</small>', right:nf(cumCost(i, l)) + '냥', cls:l === 0 ? 'btn-info' : 'btn-mint', v:l, disabled:p.money < cumCost(i, l) });
        ch.push({ label:'안 살래요', v:-1 });
        lv = await ask('<div class="big">' + tilePic(t) + '</div><h2>' + (t.type === 'city' ? '<span class="gband" style="background:' + GROUPS[t.g] + '"></span>' : '') + t.name + '</h2><p>주인이 없어요. 살까요? (가진 돈 ' + nf(p.money) + '냥)' + (t.type === 'city' ? '<br><small style="color:var(--ink2)">건물은 다음에 내 땅에 다시 도착하면 지을 수 있어요.</small>' : '') + '</p>', ch);
      }
      if (lv >= 0) { money(p, -cumCost(i, lv)); G.owner[i] = p.id; G.level[i] = lv; beep('buy'); say(pn(p) + ' <b>' + t.name + '</b>' + (lv ? '에 ' + LV[lv] + '까지 지었어요!' : '을(를) 샀어요!')); refresh(); if (hasSet(i)) { toast('같은 색 도시 완성! 통행료 2배'); } await wait(700); }
      else { say(pn(p) + ' ' + t.name + '을(를) 그냥 지나가요.'); await wait(500); }
    } else if (o === p.id) {
      const from = G.level[i];
      if (t.type === 'mark' || from >= 4) { say(pn(p) + ' 내 ' + (t.type === 'mark' ? '명소' : '도시') + ' ' + t.name + '에서 쉬어 가요.'); await wait(800); return; }
      let lv;
      if (p.ai) { await wait(700); lv = aiPickLevel(p, i, from, false); }
      else {
        const ch = [];
        for (let l = from + 1; l <= (from === 3 ? 4 : 3); l++) ch.push({ label:LV_EMO[l] + ' ' + LV[l] + (l === 4 ? ' 세우기' : '(으)로 키우기') + ' <small style="color:var(--ink2)">(통행료 ' + nf(toll(i, l)) + ')</small>', right:nf(upCost(i, from, l)) + '냥', cls:'btn-mint', v:l, disabled:p.money < upCost(i, from, l) });
        ch.push({ label:'그대로 둘래요', v:-1 });
        lv = await ask('<div class="big">' + tilePic(t) + '</div><h2>' + t.name + '</h2><p>' + (from === 3 ? '내 도시예요. <b>랜드마크</b>를 세우면 아무도 인수할 수 없어요!' : '내 도시예요. 건물을 키울까요?') + ' (가진 돈 ' + nf(p.money) + '냥)</p>', ch);
      }
      if (lv > from) { money(p, -upCost(i, from, lv)); G.level[i] = lv; beep('buy'); say(pn(p) + ' ' + t.name + '에 <b>' + LV[lv] + '</b>을(를) 지었어요!'); refresh(); if (lv === 4) toast('🏰 ' + t.name + ' 랜드마크 완성! 이제 아무도 인수할 수 없어요'); await wait(700); }
      else { say(pn(p) + ' 내 도시 ' + t.name + '에서 쉬어 가요.'); await wait(500); }
    } else {
      const own = G.players[o], v = toll(i);
      say(pn(p) + ' ' + pn(own) + '의 ' + t.name + ' 도착! 통행료 <b>' + nf(v) + '냥</b>');
      await wait(900);
      let skip = false;
      if (p.free) skip = p.ai ? v >= 150 : await ask('<div class="big">🎟️</div><h2>통행료 면제권</h2><p>' + t.name + ' 통행료 <b>' + nf(v) + '냥</b>이에요. 면제권을 쓸까요? (' + p.free + '장 있음)</p>', [{ label:'🎟️ 면제권 쓰기', cls:'btn-mint', v:true }, { label:'아껴 두고 통행료 내기', v:false }]);
      if (skip) { p.free--; beep('coin'); say(pn(p) + ' 통행료 면제권을 썼어요!'); refresh(); }
      else await pay(p, v, own, t.name + ' 통행료');
      await wait(500);
      if (p.alive && t.type === 'city' && G.owner[i] === o && G.level[i] < 4) {
        const c = p.half ? Math.round(takeCost(i) / 2) : takeCost(i); let yes = false;
        if (p.money >= c) {
          if (p.ai) { const mine = TILES.some((x, j) => x.type === 'city' && x.g === t.g && G.owner[j] === p.id); yes = p.money - c >= 300 && (mine || G.level[i] >= 1 || hasSet(i)); if (yes) await wait(600); }
          else yes = await ask('<div class="big">' + tilePic(t) + '</div><h2>' + t.name + ' 인수</h2><p>' + pn(own) + '의 도시예요. ' + (G.level[i] ? LV[G.level[i]] + '까지 통째로 ' : '') + '인수할까요?' + (p.half ? ' <b>반값 인수권 사용!</b>' : '') + '<br>인수하면 ' + pn(own) + '에게 돈을 주고 내 도시가 돼요. (가진 돈 ' + nf(p.money) + '냥)</p>',
            [{ label:'🤝 인수하기', right:nf(c) + '냥', cls:'btn-mint', v:true }, { label:'안 할래요', v:false }]);
        }
        if (yes) { if (p.half) p.half--; money(p, -c); money(own, c); G.owner[i] = p.id; beep('buy'); say(pn(p) + ' ' + pn(own) + '의 <b>' + t.name + '</b>을(를) ' + nf(c) + '냥에 인수했어요!'); refresh(); if (hasSet(i)) toast('같은 색 도시 완성! 통행료 2배'); await wait(800); }
      }
    }
  } else if (t.type === 'card') await drawCard(p);
  else if (t.type === 'give') { say(pn(p) + ' 기부 천사! 저금통에 <b>' + GIVE + '냥</b>을 넣어요.'); await wait(700); await pay(p, GIVE, 'pot', '기부금'); await wait(400); }
  else if (t.type === 'fund') { if (G.pot > 0) { const v = G.pot; G.pot = 0; money(p, v); beep('coin'); say(pn(p) + ' 꼬비 저금통에서 <b>' + nf(v) + '냥</b>을 받았어요!'); refresh(); } else say(pn(p) + ' 저금통이 비어 있어요.'); await wait(1000); }
  else if (t.type === 'island') { p.island = 3; beep('bad'); say(pn(p) + ' 도깨비섬에 도착! 3번 쉬어요.'); refresh(); await wait(1000); }
  else if (t.type === 'balloon') { p.balloon = true; say(pn(p) + ' 열기구 탑승! 다음 차례에 원하는 칸으로 날아가요.'); refresh(); await wait(1000); }
  else { say(pn(p) + ' 꼬비 마을에 도착!'); await wait(600); }
}
async function drawCard(p) {
  if (!G.deck.length) { G.deck = CARDS.map((c, k) => k); for (let k = G.deck.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [G.deck[k], G.deck[j]] = [G.deck[j], G.deck[k]]; } }
  const c = CARDS[window.__card != null ? window.__card : G.deck.pop()];
  beep('card'); say(pn(p) + ' 도깨비 주머니: ' + c.t);
  await notice(p, '<h2>🎁 도깨비 주머니</h2><div class="cardface"><div class="big">' + c.emo + '</div>' + c.t + '</div>', 2400);
  if (c.f === 'gain') { money(p, c.v); beep('coin'); }
  else if (c.f === 'lose') await pay(p, c.v, 'pot', '카드 값');
  else if (c.f === 'goto') { await fly(p, c.v, true); if (c.v !== 0) await land(p); }
  else if (c.f === 'island') { await fly(p, ISLAND, false); p.island = 3; refresh(); }
  else if (c.f === 'ticket') { p.ticket++; refresh(); }
  else if (c.f === 'each') { for (const q of alive()) { if (q === p || !p.alive) continue; if (c.v > 0) await pay(q, c.v, p, '생일 선물'); else await pay(p, -c.v, q, '간식값'); } }
  else if (c.f === 'repair') { const cost = owned(p).reduce((s, i) => s + [0, 30, 60, 100, 150][G.level[i]], 0); if (cost) await pay(p, cost, 'pot', '수리비'); else { say(pn(p) + ' 고칠 건물이 없어요.'); } }
  else if (c.f === 'step') { await walk(p, c.v); await land(p); }
  else if (c.f === 'free') { p.free++; refresh(); }
  else if (c.f === 'half') { p.half++; refresh(); }
  else if (c.f === 'again') { G.again = true; }
  else if (c.f === 'fest') { const n = owned(p).length; if (n) { money(p, n * c.v); beep('coin'); say(pn(p) + ' 도시 ' + n + '곳 축제! <b>' + nf(n * c.v) + '냥</b>을 받았어요.'); } else say(pn(p) + ' 아직 도시가 없어요.'); }
  else if (c.f === 'rich') { const r = alive().filter(q => q !== p).sort((a, b) => b.money - a.money)[0]; if (r) { say(pn(r) + ' ' + pn(p) + '에게 ' + c.v + '냥을 줘요.'); await pay(r, c.v, p, '안내비'); } }
  else if (c.f === 'mybest') { const list = owned(p).filter(i => TILES[i].type === 'city').sort((a, b) => TILES[b].price - TILES[a].price); const d = list.length ? list[0] : 0; if (d !== p.pos) await fly(p, d, true); if (d !== 0) await land(p); }
  else if (c.f === 'freebuild') {
    const list = owned(p).filter(i => TILES[i].type === 'city' && G.level[i] < 3);
    if (!list.length) say(pn(p) + ' 건물을 지을 수 있는 내 도시가 없어요.');
    else {
      let i;
      if (p.ai) i = list.sort((a, b) => TILES[b].price - TILES[a].price)[0];
      else if (list.length === 1) i = list[0];
      else { say(pn(p) + ' 🪄 공짜로 건물을 지을 내 도시를 눌러요!', true); i = await pickTile(j => list.includes(j)); }
      G.level[i]++; beep('buy'); say(pn(p) + ' ' + TILES[i].name + '에 <b>' + LV[G.level[i]] + '</b>을(를) 공짜로 지었어요!'); refresh(); landFx(i);
    }
  }
  await wait(400);
}

// ---------- 열기구 ----------
function aiBalloon(p) {
  let best = 0, score = 0;
  TILES.forEach((t, i) => {
    if (i === BALLOON) return; let s = 0;
    if (t.type === 'city' && G.owner[i] === p.id && G.level[i] < 4 && p.money - upCost(i, G.level[i], G.level[i] + 1) > 300) s = 50 + t.price / 10;
    else if ((t.type === 'city' || t.type === 'mark') && G.owner[i] == null && p.money - t.price > 300) s = 30 + t.price / 12 + (t.type === 'city' && TILES.some((x, j) => x.type === 'city' && x.g === t.g && G.owner[j] === p.id) ? 40 : 0);
    else if (i === FUND && G.pot >= 300) s = 20 + G.pot / 10;
    if (s > score) { score = s; best = i; }
  });
  return best;
}
async function pickTile(ok) {
  const my = gid; $('rollBtn').disabled = true; $('rollBtn').textContent = '칸을 골라요';
  tileEls.forEach((d, i) => d.classList.add(ok(i) ? 'pick' : 'nopick'));
  try { return await new Promise((res, rej) => { picking = { ok, res:i => my === gid ? res(i) : rej(ABORT) }; }); }
  finally { tileEls.forEach(d => d.classList.remove('pick', 'nopick')); }
}
async function balloonTurn(p) {
  p.balloon = false; let dest;
  if (p.ai) { say(pn(p) + ' 열기구로 어디로 갈까…', true); await wait(1000); dest = aiBalloon(p); }
  else {
    say(pn(p) + ' 🎈 가고 싶은 칸을 눌러요!', true);
    dest = await pickTile(i => i !== BALLOON);
  }
  say(pn(p) + ' 열기구를 타고 <b>' + TILES[dest].name + '</b>(으)로!');
  await fly(p, dest, true);
  if (dest !== 0) await land(p);
}

// ---------- 차례 ----------
async function turn(p) {
  G.turn = p.id; G.again = false; refresh();
  if (p.balloon) { await balloonTurn(p); return; }
  let doubles = 0;
  for (;;) {
    if (p.island) {
      let act = 'roll';
      if (p.ai) { if (p.ticket) act = 'ticket'; else if (p.money > 900 && G.owner.filter((o, i) => o == null && (TILES[i].type === 'city')).length > 8) act = 'pay'; }
      else act = await ask('<div class="big">' + tilePic(TILES[ISLAND]) + '</div><h2>도깨비섬</h2><p>' + pn(p) + ' 앞으로 ' + p.island + '번 쉬어야 해요. 어떻게 할까요?</p>', [
        { label:'🎲 주사위 굴리기 (같은 숫자면 탈출)', cls:'btn-info', v:'roll' },
        { label:'💰 돈 내고 탈출', right:ISLAND_FEE + '냥', cls:'btn-mint', v:'pay', disabled:p.money < ISLAND_FEE },
        { label:'🎫 탈출권 쓰기', right:p.ticket + '장', cls:'btn-mint', v:'ticket', disabled:!p.ticket }]);
      if (act === 'ticket') { p.ticket--; p.island = 0; say(pn(p) + ' 탈출권으로 도깨비섬을 나왔어요!'); refresh(); }
      else if (act === 'pay') { p.island = 0; money(p, -ISLAND_FEE); G.pot += ISLAND_FEE; beep('pay'); say(pn(p) + ' ' + ISLAND_FEE + '냥을 내고 도깨비섬을 나왔어요!'); refresh(); }
      else {
        say(pn(p) + ' 차례! 같은 숫자가 나오면 탈출해요.', true);
        await waitRoll(p, '탈출 주사위');
        const [a, b] = await rollDice();
        if (a === b) { p.island = 0; beep('double'); say(pn(p) + ' <b>' + a + ', ' + b + '</b> 같은 숫자! 도깨비섬 탈출!'); refresh(); await walk(p, a + b); await land(p); }
        else { p.island--; say(pn(p) + ' ' + a + ', ' + b + '. ' + (p.island ? '탈출 실패! ' + p.island + '번 더 쉬어요.' : '다음 차례에는 나갈 수 있어요.')); refresh(); await wait(900); }
        return;
      }
    }
    say(pn(p) + ' 차례! 주사위를 굴려요.', true);
    await waitRoll(p);
    const [a, b] = await rollDice();
    if (a === b) {
      doubles++;
      if (doubles === 3) { beep('bad'); say(pn(p) + ' 같은 숫자가 세 번 연속! 도깨비섬으로 가요.'); await wait(700); await fly(p, ISLAND, false); p.island = 3; refresh(); await wait(700); return; }
      beep('double');
    }
    say(pn(p) + ' <b>' + a + ' + ' + b + ' = ' + (a + b) + '</b>' + (a === b ? ' 같은 숫자! 한 번 더!' : ''));
    await wait(300);
    await walk(p, a + b);
    await land(p);
    const again = G.again; G.again = false;
    if (!((a === b || again) && p.alive && !p.island && !p.balloon) || G.over || alive().length < 2) return;
  }
}
async function loop(my) {
  let k = 0;
  for (;;) {
    const p = G.players[k % G.players.length];
    if (p.alive) {
      await turn(p);
      if (my !== gid) return;
      refresh();
      if (alive().length < 2 || G.endFlag) break;
      await wait(350);
    }
    k++;
  }
  finish();
}
function finish() {
  G.over = true; refresh(); $('rollBtn').disabled = true; $('rollBtn').classList.remove('pulse');
  const rank = G.players.slice().sort((a, b) => (b.alive - a.alive) || (assets(b) - assets(a))), w = rank[0];
  beep('win'); if (!w.ai || G.players.every(p => p.ai)) KBGM.jingle(); else KBGM.calm();
  say('🏆 ' + pn(w) + ' 우승!');
  showModal((IMG['ggobi-win'] ? '<img class="res-img" src="' + IMG['ggobi-win'] + '" alt="">' : '<div class="big">🏆</div>') + '<h2>' + esc(w.name) + ' 우승!</h2><p>' +
    (alive().length < 2 ? '마지막까지 남은 여행왕이에요.' : G.mode === 'time' ? '시간이 다 됐어요. 재산이 가장 많아요.' : '정한 바퀴를 다 돌았어요. 재산이 가장 많아요.') + '</p>' +
    '<div class="rank">' + rank.map((p, k) => '<div><span>' + (k + 1) + '등</span><span class="chip" style="' + chipBg(p.ci) + '"></span><span>' + esc(p.name) + '</span><span>' + (p.alive ? '재산 ' + nf(assets(p)) + '냥' : '파산') + '</span></div>').join('') + '</div>' +
    '<div class="btn-row"><button class="game-btn btn-secondary" id="mBack">처음으로</button><button class="game-btn btn-primary" id="mAgain">한 판 더!</button></div>');
  $('mBack').onclick = toStart; $('mAgain').onclick = () => { hideModal(); newGame(); };
}
layout();
</script>
