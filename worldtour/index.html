<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="꼬비샘과 쉬는 시간"/>
<meta name="theme-color" content="#2a2860"/>
<title>꼬비의 세계 여행 - 꼬비샘과 쉬는 시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6ec; --cream2:#f1e2d2; --edge:#ecc9b0; --ink:#2c2950; --ink2:#6f6585;
    --coral:#ee5a6f; --coral-d:#c8455a; --sun:#ffd25e; --sun-d:#d9a92c; --mint:#7ccf74; --mint-d:#3f8f4a; --sky:#8fc7ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a2860 url(../img/bg.jpg) center / cover no-repeat;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink); }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body.hasbg { background-image:url(img/bg.jpg); }
  .hidden { display:none !important; }
  button { font-family:'Jua',sans-serif; }

  /* ===== 상단 바 ===== */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:space-between;pointer-events:none}
  .topbar .right{display:flex;gap:8px}
  .topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:20px;padding:7px 14px;
    font-family:'Jua',sans-serif;font-size:16px;color:var(--ink);background:rgba(255,248,238,.94);text-decoration:none;cursor:pointer;line-height:1.2}
  .topbar a:hover,.topbar button:hover{filter:brightness(1.04)}
  .topbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #sndToggle{padding:7px 10px}
  #sndToggle.muted{opacity:.7}
  .kbgm-btn{padding:7px 10px}

  /* ===== 시작 화면 ===== */
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:58px 16px 16px; z-index:20; overflow-y:auto; background:rgba(30,20,70,.3); }
  .section { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:600px; margin:auto; }
  .card { background:var(--cream); border:3px solid var(--ink); border-radius:28px; box-shadow:0 8px 0 var(--ink), 0 16px 30px rgba(20,10,50,.35);
    padding:20px 24px 24px; width:100%; position:relative; }
  .logo { height:auto; width:min(420px, 92%); display:block; margin:-4px auto 0; }
  .logo-txt { font-size:clamp(34px,7vw,50px); color:var(--coral-d); line-height:1.1; }
  .logo-txt small { display:block; font-size:.5em; color:var(--ink); }
  .lead { font-size:clamp(16px,2.6vw,19px); line-height:1.5; color:var(--ink); margin:8px 0 4px; word-break:keep-all; }
  .lead b { color:var(--coral-d); font-weight:normal; }
  .start-wrap { position:relative; width:100%; }
  .start-ggobi { position:absolute; width:170px; right:-140px; bottom:-10px; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(20,10,50,.25)); }
  @media (max-width:940px){ .start-ggobi{ display:none; } }
  .box { background:#fff; border:2px solid var(--cream2); border-radius:18px; padding:10px 12px 12px; margin-top:12px; text-align:left; }
  .box-title { color:var(--coral-d); font-size:18px; margin-bottom:8px; text-align:center; }
  .slot { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .slot .chip { flex:none; width:34px; height:34px; border-radius:50%; border:3px solid var(--ink); background-size:cover; background-position:center top; }
  .slot input { flex:1; min-width:0; padding:8px 12px; border-radius:14px; border:2.5px solid var(--cream2); background:#fff; color:var(--ink);
    font-size:17px; font-family:'Jua',sans-serif; -webkit-user-select:text; user-select:text; outline:none; }
  .slot input:focus { border-color:var(--coral); }
  .slot.off input { opacity:.35; pointer-events:none; }
  .seg { display:flex; flex:none; border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; }
  .seg button { border:none; background:#fff; color:var(--ink); font-size:15px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .seg button + button { border-left:2px solid var(--ink); }
  .seg button.on { background:var(--sun); }
  .segrow { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
  .segrow .seg button { padding:8px 14px; font-size:16px; }
  .hint { font-size:14px; color:var(--ink2); text-align:center; margin-top:8px; word-break:keep-all; line-height:1.4; }
  .msg { min-height:20px; font-size:15px; color:var(--coral-d); margin-top:8px; text-align:center; word-break:keep-all; }

  .game-btn { padding:11px 24px; font-size:clamp(17px,2.8vw,20px); border-radius:40px; border:3px solid var(--ink); color:#fff;
    cursor:pointer; min-width:120px; box-shadow:none; transition:transform .08s; white-space:nowrap; }
  .game-btn:active { transform:translateY(2px) scale(.97); }
  .game-btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:var(--coral); }
  .btn-info { background:var(--sun); color:var(--ink); }
  .btn-secondary { background:#fff; color:var(--ink); }
  .btn-mint { background:var(--mint); color:var(--ink); }
  .btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  /* ===== 게임 화면 ===== */
  #game { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:14px; padding:54px 10px 10px; }
  #side { display:flex; flex-direction:column; gap:8px; width:290px; flex:none; align-self:stretch; min-height:0; }
  #players { display:flex; flex-direction:column; gap:7px; }
  .pcard { display:flex; align-items:center; gap:8px; background:var(--cream); border:3px solid var(--ink); border-radius:16px; padding:5px 10px; position:relative; transition:transform .2s, background .2s; min-width:0; }
  .pcard .chip { flex:none; width:38px; height:38px; border-radius:50%; border:3px solid var(--ink); background-size:cover; background-position:center top; }
  .pcard .nm { font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .sub { font-size:12.5px; color:var(--ink2); white-space:nowrap; }
  .pcard .mn { margin-left:auto; flex:none; font-size:19px; color:var(--coral-d); text-align:right; white-space:nowrap; }
  .pcard .mn small { display:block; font-size:11.5px; color:var(--ink2); }
  .pcard.turn { background:#fff1c9; box-shadow:0 0 0 4px var(--sun); }
  .pcard.out { opacity:.45; filter:grayscale(1); }
  .pcard .delta { position:absolute; right:10px; top:-8px; font-size:18px; pointer-events:none; animation:delta 1.4s ease-out forwards; text-shadow:0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff; }
  .delta.plus { color:var(--mint-d); } .delta.minus { color:var(--coral-d); }
  @keyframes delta { 0%{ opacity:0; transform:translateY(8px) } 15%{ opacity:1; transform:translateY(0) } 75%{ opacity:1 } 100%{ opacity:0; transform:translateY(-16px) } }
  #info { display:flex; gap:6px; flex-wrap:wrap; }
  #info span { background:rgba(255,248,238,.94); border-radius:14px; padding:3px 10px; font-size:14px; white-space:nowrap; }
  #info b { color:var(--coral-d); font-weight:normal; }
  #log { flex:1; min-height:60px; background:rgba(255,248,238,.92); border:3px solid var(--ink); border-radius:16px; padding:8px 10px; overflow-y:auto; font-size:14px; line-height:1.45; word-break:keep-all; }
  #log div { padding:2px 0; border-bottom:1px dashed var(--cream2); }
  #log div:first-child { color:var(--ink); font-size:15px; } #log div { color:var(--ink2); }
  i { font-style:normal; }
  #log i { font-style:normal; }
  #sideBtns { display:flex; gap:6px; }
  #sideBtns button { flex:1; border:2.5px solid var(--ink); border-radius:16px; background:var(--cream); color:var(--ink); font-size:14px; padding:6px 4px; cursor:pointer; white-space:nowrap; }
  #sideBtns button.on { background:var(--sun); }

  #boardWrap { position:relative; flex:none; }
  #board { position:relative; width:100%; height:100%; display:grid; grid-template-columns:1.45fr repeat(9, 1fr) 1.45fr; grid-template-rows:1.45fr repeat(9, 1fr) 1.45fr;
    background:#1f1d4a; border:4px solid var(--ink); border-radius:calc(var(--u) * 2.2); gap:calc(var(--u) * .28); padding:calc(var(--u) * .28); box-shadow:0 16px 30px rgba(20,10,50,.4); }
  .tile { position:relative; background:var(--cream); border-radius:calc(var(--u) * .8); overflow:hidden; display:flex; cursor:pointer; min-width:0; min-height:0; }
  .tile.sb { flex-direction:column; } .tile.st { flex-direction:column-reverse; }
  .tile.sl { flex-direction:row-reverse; } .tile.sr { flex-direction:row; }
  /* 건물 자리 3칸: 보드 안쪽 가장자리 */
  .tile .bstrip { flex:none; display:flex; background:rgba(44,41,80,.1); }
  .tile.sb .bstrip, .tile.st .bstrip { height:calc(var(--u) * 2.5); flex-direction:row; }
  .tile.sl .bstrip, .tile.sr .bstrip { width:calc(var(--u) * 2.5); flex-direction:column; }
  .tile .bstrip span { flex:1; min-width:0; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u) * 1.6); line-height:1; }
  .tile .bstrip { --ln:calc(var(--u) * .28) solid var(--ink); --ln2:calc(var(--u) * .16) solid rgba(44,41,80,.55); }
  .tile.sb .bstrip { border-bottom:var(--ln); } .tile.st .bstrip { border-top:var(--ln); }
  .tile.sl .bstrip { border-left:var(--ln); } .tile.sr .bstrip { border-right:var(--ln); }
  .tile.sb .bstrip span + span, .tile.st .bstrip span + span { border-left:var(--ln2); }
  .tile.sl .bstrip span + span, .tile.sr .bstrip span + span { border-top:var(--ln2); }
  .tile .bstrip img { position:absolute; inset:4%; width:92%; height:92%; object-fit:contain; filter:drop-shadow(0 calc(var(--u) * .15) 0 rgba(20,10,50,.3)); animation:bpop .35s ease-out; }
  @keyframes bpop { from{ transform:scale(.2) translateY(-60%) } 70%{ transform:scale(1.2) } }
  .tile .col { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .tile .pic { flex:1; min-width:0; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u) * 3); line-height:1; }
  .tile .pic img { position:absolute; left:6%; top:5%; width:88%; height:92%; object-fit:contain; display:block; }
  .tile .nm { flex:none; text-align:center; line-height:1.12; color:var(--ink); white-space:nowrap; overflow:hidden; padding:calc(var(--u) * .3) 0 calc(var(--u) * .25); background:rgba(44,41,80,.09); font-size:calc(var(--u) * 1.7); }
  .tile .nm.l1, .tile .nm.l2, .tile .nm.l3 { font-size:calc(var(--u) * 1.9); }
  .tile .nm.l5 { font-size:calc(var(--u) * 1.38); letter-spacing:-.03em; }
  .tile.sl .nm.l5, .tile.sr .nm.l5, .tile.corner .nm.l5 { font-size:calc(var(--u) * 1.7); }
  .tile.sl .nm br, .tile.sr .nm br { display:none; }
  .tile.own { background:var(--ot); }
  .tile.own .nm { background:var(--oc); color:var(--otx, #fff); }
  .tile.own .bstrip { background:rgba(255,255,255,.45); }
  /* 랜드마크: 카드 전체가 주인 색, 금테와 반짝임 */
  .tile.lm { background:var(--oc); }
  .tile.lm .pic img { left:3%; top:3%; width:94%; height:96%; filter:drop-shadow(0 0 calc(var(--u) * .6) #fff); }
  .tile.lm .shine { position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%); background-size:300% 100%; animation:shine 2.6s linear infinite; }
  @keyframes shine { from{ background-position:150% 0 } to{ background-position:-50% 0 } }
  .tile.corner { background:#fff1c9; }
  .tile.corner .pic { font-size:calc(var(--u) * 5); }
  .tile.t-card { background:#e8e0ff; } .tile.t-give { background:#ffe3ea; } .tile.t-mark { background:#e0f4ff; }
  .tile.pick { animation:pick .7s ease-in-out infinite alternate; z-index:3; }
  .tile.nopick { opacity:.4; }
  @keyframes pick { from{ box-shadow:inset 0 0 0 calc(var(--u) * .5) var(--sun) } to{ box-shadow:inset 0 0 0 calc(var(--u) * .5) var(--coral) } }
  .tile.here { animation:here .5s ease-out; }
  @keyframes here { 0%{ transform:scale(1) } 40%{ transform:scale(1.12); z-index:4 } 100%{ transform:scale(1) } }

  #center { grid-column:2 / 11; grid-row:2 / 11; position:relative; border-radius:calc(var(--u) * 1.2); overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u) * 1.6);
    background:radial-gradient(circle at 50% 40%, #4a47a0, #2a2860 75%); padding:calc(var(--u) * 2); }
  #center.art { background:url(img/board-center.jpg) center / cover no-repeat; }
  #cLogo { width:62%; max-height:26%; object-fit:contain; pointer-events:none; }
  #cTitle { font-size:calc(var(--u) * 6); color:var(--sun); text-shadow:0 calc(var(--u) * .4) 0 var(--ink); line-height:1; }
  #cTitle small { display:block; font-size:.5em; color:#fff; text-align:center; }
  #status { min-height:calc(var(--u) * 7); display:flex; align-items:center; justify-content:center; font-size:calc(var(--u) * 2.9); color:#fff; text-shadow:0 2px 0 rgba(20,10,50,.8); text-align:center; word-break:keep-all; line-height:1.3; padding:0 2%; }
  #status b { color:var(--sun); font-weight:normal; }
  #diceRow { display:flex; gap:calc(var(--u) * 4); height:calc(var(--u) * 11); align-items:center; }
  .die { --d:calc(var(--u) * 9); width:var(--d); height:var(--d); position:relative; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.8,.3,1); }
  .die .f { position:absolute; inset:0; outline:1px solid transparent; background:#fff; border:calc(var(--u) * .35) solid var(--ink); border-radius:18%; display:grid; grid-template:repeat(3, 1fr) / repeat(3, 1fr); padding:14%; backface-visibility:hidden; }
  .die .f i { width:70%; height:70%; border-radius:50%; background:var(--ink); align-self:center; justify-self:center; }
  .die .f.one i { background:var(--coral); width:100%; height:100%; }
  .die .f1 { transform:translateZ(calc(var(--d) / 2)); } .die .f6 { transform:rotateY(180deg) translateZ(calc(var(--d) / 2)); }
  .die .f3 { transform:rotateY(90deg) translateZ(calc(var(--d) / 2)); } .die .f4 { transform:rotateY(-90deg) translateZ(calc(var(--d) / 2)); }
  .die .f2 { transform:rotateX(90deg) translateZ(calc(var(--d) / 2)); } .die .f5 { transform:rotateX(-90deg) translateZ(calc(var(--d) / 2)); }
  #diceRow.jump .die { animation:djump .9s ease-out; }
  @keyframes djump { 0%{ top:0 } 30%{ top:calc(var(--u) * -6) } 60%{ top:0 } 75%{ top:calc(var(--u) * -1.6) } 100%{ top:0 } }
  #rollBtn { font-size:calc(var(--u) * 3.2); padding:calc(var(--u) * 1.4) calc(var(--u) * 4.5); min-width:0; }
  #rollBtn.pulse { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50%{ transform:scale(1.07) } }

  #pieces { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .piece { position:absolute; width:calc(var(--u) * 5.2); height:calc(var(--u) * 5.2); margin:calc(var(--u) * -2.6) 0 0 calc(var(--u) * -2.6); transition:left .17s linear, top .17s linear; filter:drop-shadow(0 calc(var(--u) * .5) 0 rgba(20,10,50,.35)); }
  .piece.fly { transition:left .8s cubic-bezier(.5,0,.3,1), top .8s cubic-bezier(.5,0,.3,1); }
  .piece .in { width:100%; height:100%; border-radius:50%; border:calc(var(--u) * .75) solid var(--pc); background:var(--pc) center top / cover no-repeat; box-shadow:0 0 0 calc(var(--u) * .3) var(--ink); }
  .piece.img .in { border:none; border-radius:0; box-shadow:none; background-color:transparent; background-size:contain; background-position:center; transform:scale(1.55); transform-origin:50% 85%; }
  .piece.hop .in { animation:hop .17s ease-out; }
  @keyframes hop { 50%{ transform:translateY(calc(var(--u) * -2.2)) } }
  .piece.img.hop .in { animation:hop2 .17s ease-out; } @keyframes hop2 { 50%{ transform:scale(1.55) translateY(calc(var(--u) * -1.6)) } }
  .piece.img.cur .in { animation:bob2 1s ease-in-out infinite; } @keyframes bob2 { 0%,100%{ transform:scale(1.55) } 50%{ transform:scale(1.55) translateY(calc(var(--u) * -.7)) } }
  .piece.cur { z-index:2; } .piece.cur .in { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 50%{ transform:translateY(calc(var(--u) * -1)) } }
  .piece.out { display:none; }

  /* 알림 창 */
  .modal { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(30,20,70,.4); }
  .modal .card { max-width:430px; text-align:center; max-height:calc(100vh - 32px); overflow-y:auto; animation:pop .22s ease-out; }
  @keyframes pop { from{ transform:scale(.85); opacity:0 } }
  .modal h2 { font-size:clamp(24px,5vw,30px); font-weight:normal; color:var(--coral-d); }
  .modal p { font-size:17px; line-height:1.5; color:var(--ink); margin-top:6px; word-break:keep-all; }
  .modal p b { color:var(--coral-d); font-weight:normal; }
  .modal .big { font-size:54px; line-height:1.1; }
  .modal .big img { width:150px; height:140px; object-fit:contain; }
  .modal .res-img { width:140px; display:block; margin:0 auto; }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .choices .game-btn { width:100%; white-space:normal; word-break:keep-all; padding:9px 14px; font-size:17px; display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left; }
  .choices .game-btn span:last-child { flex:none; }
  .choices .game-btn:only-child { justify-content:center; }
  table.toll { width:100%; border-collapse:collapse; margin-top:10px; font-size:15px; }
  table.toll td { padding:4px 6px; border-bottom:1px dashed var(--cream2); text-align:left; } table.toll td:last-child { text-align:right; color:var(--coral-d); }
  table.toll tr.now td { background:#fff1c9; }
  .gband { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-1px; margin-right:4px; border:2px solid var(--ink); }
  .cardface { background:#fff; border:3px solid var(--ink); border-radius:18px; padding:14px 12px; margin-top:10px; font-size:19px; line-height:1.45; word-break:keep-all; }
  .cardface .cardimg { width:min(230px, 60%); height:auto; max-height:230px; object-fit:contain; display:block; margin:0 auto 8px; }
  .cardback { width:min(200px, 55%); display:block; margin:10px auto 0; border-radius:14px; animation:cardflip .75s ease-in-out forwards; }
  @keyframes cardflip { 0%{ transform:rotateY(0) scale(.8) } 60%{ transform:rotateY(0) scale(1.05) } 100%{ transform:rotateY(90deg) scale(1.05) } }
  .cardface { animation:cardin .3s ease-out both; }
  @keyframes cardin { from{ transform:rotateY(-90deg) } }
  ul.how { list-style:none; text-align:left; margin-top:8px; }
  ul.how li { display:flex; gap:8px; align-items:flex-start; padding:7px 2px; border-bottom:1.5px dashed var(--cream2); font-size:15.5px; line-height:1.45; word-break:keep-all; }
  ul.how li:last-child { border-bottom:none; }
  ul.how .e { flex:none; width:26px; text-align:center; font-size:19px; line-height:1.2; }
  ul.how .t { display:block; color:var(--coral-d); font-weight:normal; font-size:16.5px; }
  ul.how b { color:var(--coral-d); font-weight:normal; }
  #log .stkl { display:flex; align-items:center; gap:8px; }
  #log .stkl img { width:64px; height:64px; object-fit:contain; flex:none; animation:pop .3s ease-out; }
  body.tall #log .stkl img { width:40px; height:40px; }
  .rank { text-align:left; margin-top:10px; }

  /* ===== 첫 화면 ===== */
  #title { position:fixed; inset:0; z-index:25; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:54px 0 14px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, rgba(255,230,160,.22), rgba(20,12,60,0) 60%), linear-gradient(rgba(20,12,60,.05), rgba(20,12,60,.4)); }
  .tl-row { width:100%; overflow:hidden; padding:6px 0 10px; flex:none; }

function beep(kind) {
  if (kind !== 'step' && kind !== 'dice' && kind !== 'fly') emit({ k:'beep', b:kind });
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const tone = (f, s, d, type = 'sine', v = .2) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + s);
      g.gain.setValueAtTime(v, t + s); g.gain.exponentialRampToValueAtTime(.001, t + s + d);
      o.connect(g); g.connect(actx.destination); o.start(t + s); o.stop(t + s + d + .02);
    };
    if (kind === 'step') tone(620, 0, .06, 'triangle', .16);
    else if (kind === 'dice') { for (let i = 0; i < 7; i++) tone(240 + Math.random() * 500, i * .09, .05, 'square', .07); }
    else if (kind === 'coin') { tone(988, 0, .08, 'square', .1); tone(1319, .08, .25, 'square', .1); }
    else if (kind === 'pay') { tone(330, 0, .12, 'sawtooth', .1); tone(247, .12, .22, 'sawtooth', .1); }
    else if (kind === 'buy') { [523, 659, 784].forEach((f, i) => tone(f, i * .08, .16, 'triangle', .2)); }
    else if (kind === 'card') { tone(784, 0, .1, 'triangle'); tone(1047, .1, .1, 'triangle'); tone(1319, .2, .2, 'triangle'); }
    else if (kind === 'fly') { for (let i = 0; i < 8; i++) tone(400 + i * 90, i * .07, .1, 'sine', .14); }
    else if (kind === 'bad') { [392, 330, 262].forEach((f, i) => tone(f, i * .16, .3, 'sine', .2)); }
    else if (kind === 'double') { tone(880, 0, .1, 'triangle'); tone(880, .14, .1, 'triangle'); tone(1175, .28, .25, 'triangle'); }
    else if (kind === 'win') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .22)); }
  } catch (e) {}
}

function sell(p, i) { const v = sellValue(i); G.owner[i] = null; G.bld[i] = 0; G.lm[i] = false; money(p, v); say(pn(p) + ' ' + TILES[i].name + '을(를) <b>' + nf(v) + '냥</b>에 팔았어요.'); refresh(); return v; }
async function pay(p, amount, to, why) { // to: 다른 사람, 'pot', null(은행)
  if (amount <= 0) return true;
  if (p.money < amount) {
    const all = owned(p).reduce((s, i) => s + sellValue(i), 0);
    if (p.money + all < amount) { await bankrupt(p, to, why); return false; }
    if (bot(p)) { const list = owned(p).sort((a, b) => sellValue(a) - sellValue(b)); while (p.money < amount) { sell(p, list.shift()); await wait(500); } }

function aiBalloon(p) {

  });

}

  const data = Object.assign({ st:packG(G), log:NET.log.slice(), seq:NET.seq, updatedAt:ts() }, extra || {}), ep = NET.epoch, ref = NET.ref;
  NET.floor = NET.seq;
  NET.chain = (NET.chain || Promise.resolve()).then(() => FB.runTransaction(FB.db, async tx => {
    const s = await tx.get(ref);
    if (!s.exists() || s.data().epoch !== ep) throw new Error('lost');
    tx.update(ref, data);
  })).catch(e => { if (e && e.message === 'lost') lostDrive(); else console.error(e); });
  return NET.chain;
}
function lostDrive() { // 다른 기기가 이 차례를 맡았어요
  if (!NET.driving) return;
  NET.driving = false; gid++; hideModal(); picking = null; tileEls.forEach(d => d.classList.remove('pick', 'nopick'));
  NET.lastSeen = NET.room ? NET.room.seq : NET.lastSeen; NET.floor = 0; NET.applied = -1;
  if (NET.room && NET.room.st) applyRoom(NET.room);
  pump();
}
async function startDrive() {
  const r = NET.room;
  NET.driving = true; NET.epoch = r.epoch; NET.log = (r.log || []).slice(); NET.seq = r.seq || 0; NET.lastSeen = NET.seq; NET.floor = NET.seq;
  gid++; const my = gid;
  G = unpackG(r.st); NET.applied = r.seq; refresh();
  try {
    const p = G.players[G.turn];
    if (p && p.alive && !G.over) await turn(p);
    if (my !== gid) return;
    refresh();
    if (G.mode === 'time' && Date.now() >= G.endAt) G.endFlag = true;
    if (alive().length < 2 || G.endFlag) {
      G.over = true; emit({ k:'over' });
      await flush({ status:'done', drv:'' });
      if (my !== gid) return;
      NET.driving = false; NET.lastSeen = NET.seq; finish(); return;
    }
    let k = G.turn; do { k = (k + 1) % G.players.length; } while (!G.players[k].alive);
    await wait(350);
    G.turn = k; emit({ k:'turn', p:k });
    await flush({ drv:ownerUid(G.players[k]), epoch:NET.epoch + 1 });
  } catch (e) { if (e !== ABORT) { console.error(e); toast('앗, 문제가 생겼어요.'); } return; }
  if (my !== gid) return;
  NET.driving = false; NET.lastSeen = NET.seq; NET.applied = NET.seq;
  updRoll(); pump();
}
function ownerUid(p) { // 이 사람 차례를 진행할 기기
  const r = NET.room, away = r.away || {};
  if (!p.ai && !away[p.uid]) return p.uid;
  const h = (r.seats || []).find(x => !x.ai && !away[x.uid] && (x.uid === myId || !dead(x.uid)));
  return h ? h.uid : myId;
}
const dead = uid => uid !== myId && (!NET.seen[uid] || Date.now() - NET.seen[uid] > DEAD_MS);
function checkDrive() {
  const r = NET.room;
  if (!NET.on || !r || r.status !== 'playing' || NET.driving || NET.pumping || !G || (r.seq || 0) < NET.floor) return;
  if ((r.log || []).some(e => e.n > NET.lastSeen)) { pump(); return; }
  if (NET.applied !== r.seq) applyRoom(r);
  if (r.drv === myId && NET.role !== 'watch' && !G.over) startDrive();
}
function watchdog() { // 진행하던 기기가 사라지면 다른 기기가 이어서 해요
  const r = NET.room;
  if (!r || r.status !== 'playing' || NET.role === 'watch' || NET.driving || NET.taking || !G || G.over) return;
  if (r.drv === myId) { checkDrive(); return; }
  if (r.drv && !dead(r.drv)) return;
  const mgr = (r.seats || []).find(x => !x.ai && (x.uid === myId || !dead(x.uid)));
  if (!mgr || mgr.uid !== myId) return;
  takeover(r.drv, r.epoch);
}
async function takeover(old, ep) {
  NET.taking = true;
  try {
    await FB.runTransaction(FB.db, async tx => {
      const s = await tx.get(NET.ref), d = s.data();
      if (d.epoch !== ep || d.status !== 'playing') return;
      const up = { drv:myId, epoch:ep + 1, updatedAt:ts() };
      if (old && (d.seats || []).some(x => x.uid === old && !x.ai)) up['away.' + old] = true;
      tx.update(NET.ref, up);
    });
  } catch (e) { console.error(e); }
  NET.taking = false;
}

// ---------- 다른 기기의 진행을 그대로 보여 주기 ----------
async function pump() {
  if (NET.pumping || NET.driving || !NET.on) return;
  NET.pumping = true; const my = gid;
  try {
    for (;;) {
      const r = NET.room;
      if (!r || r.status === 'waiting' || !r.st || my !== gid || NET.driving || !G || (r.seq || 0) < NET.floor) break;
      const evs = (r.log || []).filter(e => e.n > NET.lastSeen);
      if (!evs.length) { if (NET.applied !== r.seq) applyRoom(r); break; }
      for (const e of evs) { await replay(e); if (my !== gid) break; NET.lastSeen = e.n; }
    }
  } catch (e) { if (e !== ABORT) console.error(e); }
  NET.pumping = false;
  if (my === gid) checkDrive(); else if (NET.on) pump();
}
async function replay(e) {
  const P = i => G.players[i];
  switch (e.k) {
    case 'say': say(e.h, e.q); break;
    case 'beep': beep(e.b); break;
    case 'money': if (P(e.p)) money(P(e.p), e.v); break;
    case 'toast': toast(e.t); break;
    case 'fx': landFx(e.i); break;
    case 'turn': G.turn = e.p; drawPlayers(); drawPieces(); updRoll(); break;
    case 'think': if (P(e.p)) say(pn(P(e.p)) + ' 🤔 ' + esc(e.t || '고르는 중') + '…', true); break;
    case 'dice': await showDice(e.v); break;
    case 'walk': await walk(P(e.p), e.s, true); break;
    case 'sail': await sail(P(e.p), e.d, true); break;
    case 'fly': await fly(P(e.p), e.d, false); break;
    case 'cardback': if (IMG['card-back']) { showModal('<h2>🎁 도깨비 주머니</h2><img class="cardback" src="' + IMG['card-back'] + '" alt="">'); try { await wait(750); } finally { hideModal(); } } break;
    case 'note': showModal(e.h); try { await wait(Math.max(1500, e.ms || 1500)); } finally { hideModal(); } break;
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && NET.on) { heartbeat(); watchdog(); } });

// ---------- 응원 스티커 ----------
const STICKERS = ['best', 'cheer', 'wow', 'clap', 'nervous', 'laugh', 'again', 'heart'];
let stkCool = 0, stkHideT = 0;
$('stkTray').innerHTML = '<div class="tt">응원 스티커를 골라요</div>' + STICKERS.map(n => '<button data-s="' + n + '"><img src="../omok/img/sticker-' + n + '.png" alt=""></button>').join('');
$('stkTray').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('stkTray').classList.add('hidden'); sendSticker(b.dataset.s); });
document.addEventListener('pointerdown', e => { if (!$('stkTray').classList.contains('hidden') && !e.target.closest('#stkTray, #stkBtn, #lbStk')) $('stkTray').classList.add('hidden'); });
$('stkBtn').onclick = $('lbStk').onclick = () => {
  const t = $('stkTray'); t.classList.toggle('hidden'); t.classList.toggle('cool', Date.now() < stkCool);
  if (Date.now() < stkCool) setTimeout(() => t.classList.remove('cool'), stkCool - Date.now());
};
async function sendSticker(n) {
  if (!NET.ref || Date.now() < stkCool) return;
  stkCool = Date.now() + 4000;
  const r = NET.room || {}, me = (r.seats || []).find(x => x.uid === myId);
  const by = me ? me.name : (r.watch || {})[myId] || store('worldtour-name') || '구경꾼';
  try { await FB.updateDoc(NET.ref, { stk:{ id:Math.random().toString(36).slice(2, 9), s:n, by, w:me ? 0 : 1 } }); }
  catch (e) { console.error(e); toast('스티커를 보내지 못했어요'); }
}
function showSticker(st) {
  if (!STICKERS.includes(st.s)) return;
  if (!$('game').classList.contains('hidden') && $('log').offsetParent) { // 게임 중에는 오른쪽 아래 기록 칸에
    const d = document.createElement('div'); d.className = 'stkl';
    d.innerHTML = '<img src="../omok/img/sticker-' + st.s + '.png" alt=""><span>' + (st.w ? '👀 ' : '') + esc(st.by || '') + '의 응원!</span>';
    $('log').prepend(d); while ($('log').children.length > 40) $('log').lastChild.remove();
    $('log').scrollTop = 0; beep('card'); return;
  }
  const el = $('stkShow'), box = $('game').classList.contains('hidden') ? $('lobby').querySelector('.card') : $('boardWrap');
  const r = box.getBoundingClientRect(), size = Math.min(190, Math.max(110, r.width * .3));
  el.style.width = size + 'px';
  el.style.left = (r.left + r.width / 2 - size / 2) + 'px'; el.style.top = (r.top + r.height * .14) + 'px';
  $('stkImg').src = '../omok/img/sticker-' + st.s + '.png';
  $('stkWho').textContent = (st.w ? '👀 ' : '') + (st.by || '');
  el.classList.remove('hidden', 'on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(stkHideT); stkHideT = setTimeout(() => el.classList.add('hidden'), 2700);
  beep('card');
}
layout();
</script>
