<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="/icons/icon-180.png"/>
<link rel="icon" type="image/png" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="깨비의 꽃들의 전쟁"/>
<meta name="theme-color" content="#1f5a3c"/>
<title>깨비의 꽃들의 전쟁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6ec; --cream2:#f1e2d2; --ink:#2c2950; --ink2:#6f6585;
    --coral:#ee5a6f; --coral-d:#c8455a; --sun:#ffd25e; --sun-d:#d9a92c; --mint:#7ccf74; --mint-d:#3f8f4a; --sky:#8fc7ff;
    --felt:#2e7a4f; --felt-d:#1c5136;
    --hw:64px;    /* 내 손 카드 너비 (JS가 바꿔요) */
    --fw:52px;    /* 바닥 카드 너비 */
    --cw:22px;    /* 먹은 카드 너비 */
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
    background:var(--felt-d) radial-gradient(ellipse at 50% 45%, #3a8f5f 0%, var(--felt) 45%, var(--felt-d) 100%); }
  body.art { background:var(--felt-d) url(img/bg.jpg) center / cover no-repeat; }
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .hidden { display:none !important; }
  button { font-family:'Jua',sans-serif; }

  /* ===== 상단 바 ===== */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;justify-content:space-between;pointer-events:none}
  .topbar .right{display:flex;gap:8px}
  .topbar a,.topbar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:20px;padding:6px 13px;
    font-family:'Jua',sans-serif;font-size:16px;color:var(--ink);background:rgba(255,248,238,.95);text-decoration:none;cursor:pointer;line-height:1.2}
  .topbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #sndToggle,.kbgm-btn{padding:6px 10px}
  #sndToggle.muted,.kbgm-btn.muted{opacity:.6}
  @media (max-width:600px){ .topbar .t{ display:none; } }

  /* ===== 덮개 화면 ===== */
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:58px 16px 16px; z-index:20; overflow-y:auto; background:rgba(10,30,20,.25); }
  .section { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px; margin:auto; }
  .card { background:var(--cream); border:3px solid var(--ink); border-radius:28px; box-shadow:0 16px 30px rgba(10,30,20,.35);
    padding:20px 24px 24px; width:100%; position:relative; }
  .logo { width:min(520px, 96%); display:block; margin:0 auto 4px; }
  .logo-text { font-size:clamp(46px,11vw,72px); line-height:1.05; margin:6px 0 4px; color:var(--coral); -webkit-text-stroke:5px var(--ink); paint-order:stroke fill;
    text-shadow:0 5px 0 var(--ink); white-space:nowrap; }
  .logo-text .l1 { font-size:.62em; } .logo-text .y { color:var(--sun); } .logo-text .w { color:#fff; font-size:.7em; }
  .start-wrap { position:relative; width:100%; }
  .start-ggaebi { position:absolute; width:210px; left:-232px; top:110px; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(20,10,50,.25)); animation:ggIn .7s cubic-bezier(.2,1.3,.4,1) both .15s; }
  @keyframes ggIn { from { opacity:0; transform:translateX(-60px) rotate(-6deg); } to { opacity:1; transform:none; } }
  @media (max-width:1040px){ .start-ggaebi{ display:none; } }
  .box { background:#fff; border:2px solid var(--cream2); border-radius:18px; padding:12px 14px 14px; margin-top:12px; text-align:left; }
  .box-title { color:var(--coral-d); font-size:18px; margin-bottom:8px; text-align:center; }
  .field { display:flex; gap:8px; align-items:center; }
  .field input { flex:1; min-width:0; padding:10px 14px; border-radius:16px; border:2.5px solid var(--cream2); background:#fff; color:var(--ink);
    font-size:18px; font-family:'Jua',sans-serif; -webkit-user-select:text; user-select:text; outline:none; }
  .field input:focus { border-color:var(--coral); }
  .field input::placeholder { color:#c9b5a3; }
  #codeInput { letter-spacing:8px; text-align:center; font-size:24px; }
  .seg { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .seg button { border:2.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:16px; padding:6px 12px; font-size:16px; cursor:pointer; white-space:nowrap; }
  .seg button.on { background:var(--sun); }
  .seg-label { font-size:17px; text-align:center; margin:2px 0 8px; color:var(--ink2); }
  .wallet { display:inline-flex; align-items:center; gap:4px; background:var(--ink); color:var(--sun); border-radius:12px; padding:0 9px 0 4px; font-size:15px; margin-left:6px; vertical-align:1px; }
  .yp { display:inline-block; width:1em; height:1em; border-radius:50%; flex:none; position:relative; vertical-align:-.12em;
    background:radial-gradient(circle at 35% 30%, #fff6c4 0 12%, #ffd84d 30%, #e2a516 70%, #a96d07 100%); box-shadow:inset 0 0 0 1.5px #7a4c00; }
  .yp::after { content:''; position:absolute; left:50%; top:50%; width:32%; height:32%; transform:translate(-50%,-50%); background:#3a2a10; border-radius:1px; box-shadow:0 0 0 1px #7a4c00; }
  .seg.stake button { display:flex; flex-direction:column; align-items:center; line-height:1.15; padding:5px 12px; }
  .seg.stake button small { font-size:12px; opacity:.75; }
  .seg.stake button:disabled { opacity:.4; cursor:not-allowed; }
  .refill { text-align:center; margin-top:8px; } .refill .note { margin:4px 0 0; font-size:14px; color:var(--ink2); }
  .coinchip { display:inline-flex; align-items:center; gap:4px; background:var(--ink); color:var(--sun); border-radius:12px; padding:1px 9px 1px 4px; font-size:15px; white-space:nowrap; }
  .coinchip.up { animation:cup .9s ease-out; } .coinchip.down { animation:cdown .9s ease-out; }
  @keyframes cup { 0%{transform:scale(1)} 30%{transform:scale(1.3); background:#2f9e58} 100%{transform:scale(1)} }
  @keyframes cdown { 0%{transform:scale(1)} 30%{transform:scale(1.2); background:var(--coral-d)} 100%{transform:scale(1)} }
  .flycoin { position:fixed; z-index:75; width:26px; height:26px; pointer-events:none; font-size:26px; }
  .res-coin { font-size:clamp(30px,6vw,44px); margin:6px 0 2px; display:flex; align-items:center; justify-content:center; gap:8px; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; }
  .res-coin.plus { color:var(--sun); } .res-coin.minus { color:#ff8b95; } .res-coin .yp { font-size:.85em; -webkit-text-stroke:0; }
  .res-coin.pop { animation:pop .5s ease-out; }
  .res-wallet { font-size:15px; color:var(--ink2); margin-bottom:6px; }
  .broke { margin:6px 0; color:var(--coral-d); font-size:17px; }
  .gs-won { display:inline-flex; align-items:center; gap:5px; font-weight:normal; font-size:1.35em; color:var(--coral-d); }
  .msg { min-height:20px; font-size:15px; color:var(--coral-d); margin-top:8px; text-align:center; word-break:keep-all; }
  .note { font-size:14px; color:var(--ink2); margin-top:8px; text-align:center; word-break:keep-all; line-height:1.45; }

  .game-btn { padding:11px 24px; font-size:clamp(17px,2.8vw,20px); border-radius:40px; border:3px solid var(--ink); color:#fff;
    cursor:pointer; min-width:120px; transition:transform .08s; white-space:nowrap; }
  .game-btn:active { transform:translateY(2px) scale(.97); }
  .game-btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-primary { background:var(--coral); } .btn-info { background:var(--sun); color:var(--ink); } .btn-secondary { background:#fff; color:var(--ink); }
  .btn-sky { background:var(--sky); color:var(--ink); } .btn-mint { background:var(--mint); color:var(--ink); }
  .mode-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode-row .game-btn { min-width:0; padding:10px 6px; font-size:clamp(15px,2.4vw,18px); white-space:normal; line-height:1.2; word-break:keep-all; }
  .mode-row .game-btn small { display:block; font-size:13px; opacity:.85; margin-top:2px; }

  /* 시작 화면 고급 버튼 */
  .mode-btn { position:relative; display:flex; align-items:center; justify-content:center; gap:10px; min-height:74px; padding:8px 14px;
    border:3px solid var(--ink); border-radius:20px; cursor:pointer; color:#fff7e0; font-family:'Jua',sans-serif; overflow:hidden;
    font-size:clamp(22px,3.4vw,27px); transition:transform .1s, filter .15s;
    box-shadow:inset 0 0 0 3px #f3c75a, inset 0 0 0 5px rgba(60,20,10,.55), 0 6px 14px rgba(20,10,30,.22); }
  .mode-btn::before { content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%),
      radial-gradient(circle at 12% 120%,rgba(255,220,120,.25),transparent 45%); }
  .mode-btn .mt { position:relative; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 3px 0 var(--ink); letter-spacing:1px; }
  .mode-btn .fan { position:relative; display:flex; flex:none; }
  .mode-btn .fan img { width:34px; height:46px; border-radius:4px; border:2px solid var(--ink); background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.3); }
  .mode-btn .fan img + img { margin-left:-12px; }
  .mode-btn .fan img:nth-child(1) { transform:rotate(-12deg) translateY(2px); }
  .mode-btn .fan img:nth-child(2) { transform:rotate(0deg); }
  .mode-btn .fan img:nth-child(3) { transform:rotate(12deg) translateY(2px); }
  .mode-btn .fan img:last-child:nth-child(2) { transform:rotate(12deg) translateY(2px); }
  .mode-btn:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-2px); }
  .mode-btn:hover:not(:disabled) .fan img:first-child { transform:rotate(-18deg) translate(-2px,2px); }
  .mode-btn:hover:not(:disabled) .fan img:last-child { transform:rotate(18deg) translate(2px,2px); }
  .mode-btn .fan img { transition:transform .2s; }
  .mode-btn:active:not(:disabled) { transform:scale(.97); }
  .mode-btn:disabled { opacity:.5; cursor:not-allowed; filter:grayscale(.4); }
  .mode-btn.wide { grid-column:1/-1; }
  .m-ink { background:linear-gradient(160deg,#4b5fb8,#28306e); }
  .m-pine { background:linear-gradient(160deg,#3d9a5c,#1d5a36); }
  .m-red { background:linear-gradient(160deg,#e2475a,#97202f); }
  .m-plum { background:linear-gradient(160deg,#9a5ab8,#55287a); min-height:58px; }
  .seg-label { margin-top:14px; }
  .seg-label .lb { display:inline-block; color:var(--coral-d); font-size:17px; padding:0 14px; position:relative; }
  .seg-label .lb::before, .seg-label .lb::after { content:''; position:absolute; top:50%; width:8px; height:8px; margin-top:-4px; background:var(--sun-d); transform:rotate(45deg); border-radius:2px; }
  .seg-label .lb::before { left:0; } .seg-label .lb::after { right:0; }
  .seg button { background:linear-gradient(180deg,#fffdf7,#f6ead8); font-family:'Jua',sans-serif; transition:transform .1s; }
  .seg button:hover:not(:disabled) { transform:translateY(-1px); }
  .seg button.on { background:linear-gradient(180deg,#ffe58a,#f4b93a); box-shadow:inset 0 0 0 2px #fff4c8; }
  #helpBtn { display:inline-block; margin-top:14px; padding:6px 18px; border:2.5px solid var(--ink); border-radius:16px; background:linear-gradient(180deg,#fffdf7,#f6ead8); color:var(--ink); text-decoration:none; font-family:'Jua',sans-serif; font-size:16px; }
  @media (max-width:420px){ .seg.stake { flex-wrap:nowrap; gap:4px; } .seg.stake button { padding:5px 7px; font-size:14px; } .seg.stake button small { font-size:11px; } }

  /* ===== 시작 화면: 어두운 옻칠 판 + 한 화면에 ===== */
  #startScreen { padding-top:54px; padding-bottom:10px; }
  #startScreen .section { max-width:540px; }
  #startScreen .card { background:linear-gradient(180deg,rgba(34,26,62,.94),rgba(20,15,40,.96)); border:3px solid var(--ink);
    box-shadow:inset 0 0 0 3px #e9b949, inset 0 0 0 5px rgba(120,30,30,.8), 0 16px 34px rgba(0,0,0,.45); padding:12px 18px 14px; color:#fff3d6; }
  #startScreen .logo { width:auto; max-width:min(360px,80%); max-height:clamp(110px,21vh,185px); margin:0 auto; }
  #startScreen .box { background:rgba(255,240,210,.06); border:1.5px solid rgba(233,185,73,.4); border-radius:16px; padding:10px 12px; margin-top:8px; }
  #startScreen .field input { background:rgba(10,8,25,.55); border:2px solid rgba(233,185,73,.55); color:#fff3d6; padding:8px 14px; font-size:17px; }
  #startScreen .field input:focus { border-color:#ffd25e; }
  #startScreen .field input::placeholder { color:rgba(255,236,200,.45); }
  #startScreen .seg-label { margin:8px 0 6px; } #startScreen .seg-label .lb { color:#ffd25e; }
  #startScreen .seg button { background:rgba(255,240,210,.08); color:#fff3d6; border:2px solid rgba(233,185,73,.6); }
  #startScreen .seg button.on { background:linear-gradient(180deg,#ffe58a,#f4b93a); color:var(--ink); border-color:#ffe9a8; box-shadow:inset 0 0 0 2px #fff4c8; }
  #startScreen .seg button:disabled { opacity:.35; }
  #startScreen .start-top { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin:-2px -4px 0; }
  #startScreen .start-top .wallet { margin:0; font-size:16px; padding:2px 10px 2px 5px; }
  .charge-btn { font-family:'Jua',sans-serif; font-size:14px; padding:2px 11px; border-radius:12px; cursor:pointer; color:#ffd25e; background:rgba(255,240,210,.08); border:1.5px solid rgba(233,185,73,.6); }
  .charge-btn:hover { background:rgba(255,210,94,.18); }
  #startScreen .wallet { background:#0d0a1e; border:1.5px solid rgba(233,185,73,.6); }
  #startScreen .msg { color:#ff9aa6; min-height:0; margin-top:4px; }
  #startScreen .note { color:rgba(255,236,200,.75); }
  #startScreen #helpBtn { margin-top:8px; background:rgba(255,240,210,.08); color:#fff3d6; border:2px solid rgba(233,185,73,.6); padding:4px 16px; font-size:15px; }
  .mode-row.three { grid-template-columns:repeat(3,1fr); gap:8px; }
  .mode-row.three .mode-btn { flex-direction:column; gap:4px; min-height:0; padding:10px 4px 8px; font-size:clamp(19px,3.2vw,24px); }
  .room-row { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:center; }
  .room-row > * { min-width:0; }
  .room-row .mode-btn { min-height:0; height:46px; padding:0 18px; font-size:19px; white-space:nowrap; }
  .room-row #joinBtn { padding:8px 14px; font-size:17px; }
  @media (max-width:420px){ .mode-row.three { grid-template-columns:repeat(3,1fr); } .room-row { grid-template-columns:1fr; } .mode-row.three .mode-btn .fan img { width:28px; height:38px; } }
  @media (max-height:780px){ #startScreen .logo { max-height:clamp(90px,18vh,150px); } #startScreen .box { padding:8px 12px; margin-top:6px; } #startScreen .seg-label { margin:5px 0 4px; } #startScreen #helpBtn { margin-top:5px; } }

  /* 옻칠 판 창 (시작 화면과 같은 느낌) */
  .card.lacquer { background:linear-gradient(180deg,rgba(34,26,62,.97),rgba(20,15,40,.98)); color:#fff3d6;
    box-shadow:inset 0 0 0 3px #e9b949, inset 0 0 0 5px rgba(120,30,30,.8), 0 18px 40px rgba(0,0,0,.55); padding:18px 22px 20px; }
  .lacquer .lq-title { margin:0 0 12px; font-size:clamp(26px,5vw,32px); color:#ffd25e; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 3px 0 var(--ink); font-weight:normal; }
  .lacquer .field input { background:rgba(10,8,25,.55); border:2px solid rgba(233,185,73,.55); color:#fff3d6; text-align:center; letter-spacing:6px; }
  .lacquer .field input:focus { border-color:#ffd25e; }
  .lacquer .field input::placeholder { color:rgba(255,236,200,.45); letter-spacing:1px; }
  .lacquer .seg button { background:rgba(255,240,210,.08); color:#fff3d6; border:2px solid rgba(233,185,73,.6); }
  .lacquer .seg button.on { background:linear-gradient(180deg,#ffe58a,#f4b93a); color:var(--ink); border-color:#ffe9a8; box-shadow:inset 0 0 0 2px #fff4c8; }
  .lacquer .msg { color:#ff9aa6; }
  .lq-btns { align-items:center; }
  .lq-btns .mode-btn { min-height:0; height:50px; padding:0 22px; font-size:20px; }
  .lq-ghost { font-family:'Jua',sans-serif; font-size:17px; height:50px; padding:0 20px; border-radius:20px; cursor:pointer; background:rgba(255,240,210,.08); color:#fff3d6; border:2px solid rgba(233,185,73,.6); }
  .lq-ghost:hover { background:rgba(255,240,210,.16); }
  #joinBtn { background:linear-gradient(180deg,#ffe58a,#f4b93a); box-shadow:inset 0 0 0 2px #fff4c8; }
  @media (max-width:420px){ .mode-row{ grid-template-columns:1fr; } }
  .btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .link-btn { background:none; border:none; color:var(--ink2); font-size:15px; text-decoration:underline; cursor:pointer; margin-top:10px; }

  /* 대기실 */
  .wait-img { width:150px; display:block; margin:-80px auto 0; }
  .code-label { font-size:18px; color:var(--ink2); margin-top:6px; }
  .code-big { display:flex; gap:10px; justify-content:center; margin:8px 0 6px; }
  .code-big span { width:clamp(56px,14vw,76px); height:clamp(70px,17vw,92px); display:flex; align-items:center; justify-content:center; font-size:clamp(44px,11vw,62px);
    background:#fff; border:3px solid var(--ink); border-radius:16px; color:var(--coral-d); }
  .lead { font-size:clamp(16px,2.6vw,19px); line-height:1.5; margin:8px 0 4px; word-break:keep-all; }
  .tags { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:10px 0 0; }
  .tag { font-size:14px; padding:3px 10px; border-radius:20px; background:#fff1c9; border:2px solid var(--sun-d); color:var(--ink); }
  .members { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
  .members span { background:#fff; border:2.5px solid var(--ink); border-radius:16px; padding:4px 12px; font-size:17px; }
  .members span.me { background:#fff1c9; }
  .members span small { font-size:12px; color:var(--coral-d); margin-left:4px; }
  .dots::after { content:''; animation:dots 1.5s steps(4) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* ===== 화투 카드 ===== */
  .ht { --w:var(--fw); width:var(--w); height:calc(var(--w) * 1.3333); flex:none; position:relative; display:block;
    background:center / contain no-repeat; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .ht.back { background-image:url(img/card-back.webp); }
  .ht.new { animation:pop .35s ease-out; }
  @keyframes pop { 0%{ transform:scale(.4); opacity:0 } 70%{ transform:scale(1.08); opacity:1 } 100%{ transform:scale(1) } }
  .ht.ghost { visibility:hidden; animation:none !important; }
  .ht.flyc { position:fixed; z-index:70; pointer-events:none; will-change:transform; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
  .fx-ring { position:fixed; z-index:69; pointer-events:none; border-radius:50%; border:4px solid rgba(255,240,190,.95); box-shadow:0 0 18px rgba(255,210,94,.9), inset 0 0 12px rgba(255,255,255,.7);
    animation:ring .45s ease-out forwards; }
  .fx-ring.art { border:none; box-shadow:none; border-radius:0; background:url(img/fx-slam.webp) center / contain no-repeat; }
  @keyframes ring { 0%{ transform:scale(.35); opacity:1 } 100%{ transform:scale(1.15); opacity:0 } }
  .fx-spk { position:fixed; z-index:69; pointer-events:none; background:url(img/fx-sparkle.webp) center / contain no-repeat; animation:spkimg .6s ease-out forwards; }
  @keyframes spkimg { 0%{ transform:scale(.4) rotate(-20deg); opacity:0 } 30%{ opacity:1 } 100%{ transform:scale(1.2) rotate(15deg); opacity:0 } }
  .spk { position:fixed; z-index:69; pointer-events:none; width:10px; height:10px; margin:-5px 0 0 -5px; background:var(--sun);
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:spk .6s ease-out forwards; }
  @keyframes spk { 0%{ transform:translate(0,0) scale(.4); opacity:1 } 100%{ transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(90deg); opacity:0 } }
  #mid.shake { animation:shk .28s ease-out; } #mid.shake2 { animation:shk2 .5s ease-out; }

(function(){
  var b=document.getElementById('fs-btn'),t=document.getElementById('fs-txt'),d=document,el=d.documentElement;
  var can=d.fullscreenEnabled||d.webkitFullscreenEnabled;
  var framed=false;try{framed=window.top!==window;}catch(e){framed=true;}
  if(!can){
    if(framed){t.textContent='새 창으로';b.title='새 창으로 크게 열기';b.addEventListener('click',function(){window.open(location.href,'_blank');});}
    else b.style.display='none';
    return;
  }
  var cur=function(){return d.fullscreenElement||d.webkitFullscreenElement;};
  b.addEventListener('click',function(){
    if(cur()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{var pr=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(pr&&pr.catch)pr.catch(function(){});}
    b.blur();
  });
  var upd=function(){t.textContent=cur()?'나가기':'전체화면';};
  d.addEventListener('fullscreenchange',upd);d.addEventListener('webkitfullscreenchange',upd);
})();
</script>
